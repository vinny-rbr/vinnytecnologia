<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesas - Meu Giro</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="vinny-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #121212; color: #ececec; font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font-family: Manrope, system-ui, sans-serif; }
  input::placeholder { color: #6b747d; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #2c2c2c; border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }
  .sora { font-family: Sora, Manrope, sans-serif; }
  .fundo-app { min-height: 100vh; display: flex; flex-direction: column; background: #121212; }

  /* header */
  .hdr { height: 64px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid #262626; background: rgba(18,18,18,.94); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: #13233f; border: 1px solid #1f3256; display: flex; align-items: center; justify-content: center; font: 700 12px Sora; color: #3b9be8; flex: none; }
  .marca { display: flex; flex-direction: column; line-height: 1.1; }
  .marca b { font: 700 16px Sora; color: #f4f4f4; }
  .marca small { font-size: 10px; font-weight: 700; letter-spacing: .16em; color: #f5a524; }
  .sep { width: 1px; height: 28px; background: #2c2c2c; }
  .hbtn { display: flex; flex: none; white-space: nowrap; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #2c2c2c; background: #1a1a1a; color: #d6d6d6; font-weight: 600; font-size: 13px; cursor: pointer; }
  .hbtn:hover { background: #242424; color: #fff; }
  .hbtn.ghost { background: transparent; }
  .loja { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 8px; border-radius: 10px; border: 1px solid #2c2c2c; background: #1a1a1a; font-size: 13px; color: #d6d6d6; }
  .loja .av { width: 22px; height: 22px; border-radius: 50%; background: #1d3a63; color: #8cc6f5; font: 700 10px Sora; display: flex; align-items: center; justify-content: center; flex: none; }
  .loja select { background: transparent; border: 0; color: #d6d6d6; font: 600 13px Manrope; outline: none; max-width: 220px; cursor: pointer; }
  .loja select option { background: #171717; }
  .hdr.internet { border-bottom-color: #6b4a12; background: rgba(42,30,10,.9); }
  .hdr.offline { border-bottom-color: #6b2a2a; background: rgba(44,14,18,.9); }
  .faixa { position: sticky; top: 64px; z-index: 9; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600; text-align: center; }
  .faixa.internet { background: #f5a524; color: #1a1204; }
  .faixa.offline { background: #f05252; color: #fff; }
  .faixa i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; animation: pisca 1.2s infinite; }
  @keyframes pisca { 50% { opacity: .25; } }
  @media (max-width: 640px) { .hdr { padding: 0 12px; gap: 10px; } .marca { display: none; } .loja select { max-width: 120px; } }

  /* mesas */
  .main-mesas { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px; }
  .h1 { margin: 0; font: 700 28px Sora; letter-spacing: -.02em; color: #f4f4f4; }
  .resumo { font-size: 14px; color: #9aa3ab; }
  .filtros { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #181818; border: 1px solid #262626; }
  .filtros button { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 0; border-radius: 9px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .filtros .dot { width: 7px; height: 7px; border-radius: 50%; }
  .filtros .cnt { font-family: Sora; font-size: 12px; opacity: .7; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px; }
  .card { position: relative; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 148px; padding: 16px; border-radius: 16px; color: #ececec; cursor: pointer; overflow: hidden; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: #2f4570 !important; }
  .card .barra { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; opacity: .9; }
  .rot { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #7d8a96; }
  .num { font: 700 34px Sora; line-height: 1; letter-spacing: -.03em; color: #f4f4f4; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; }

  /* mesa (design "Mesa Pedido"): produtos compactos à esquerda, comanda num painel estreito à direita */
  .main-mesa { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: minmax(0,1fr) minmax(300px,360px); gap: 20px; padding: 20px 24px; height: calc(100vh - 64px); }
  .main-mesa.so-aside { grid-template-columns: minmax(300px,520px); justify-content: center; }
  .prods { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
  .prods .topo-p { display: flex; align-items: center; gap: 10px; }
  .voltar { white-space: nowrap; flex-shrink: 0; height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid #2c2c2c; background: transparent; color: #ececec; font: 600 14px Manrope; cursor: pointer; }
  .voltar:hover { background: #1d1d1d; }
  .busca { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid #262626; background: #181818; }
  .busca span { color: #5ab0f0; font-size: 14px; }
  .busca input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #ececec; font: 500 15px Manrope; }
  .busca:focus-within { border-color: #5ab0f0; }
  .abas { display: flex; gap: 22px; flex-wrap: wrap; }
  .abas button { flex: none; white-space: nowrap; height: 34px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #7d8a96; font: 600 14px Manrope; cursor: pointer; }
  .abas button:hover { color: #fff; }
  .abas button.on { border-bottom-color: #5ab0f0; color: #f4f4f4; }
  .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chips button { white-space: nowrap; flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #2c2c2c; background: transparent; color: #9aa3ab; font: 700 13px Manrope; cursor: pointer; }
  .chips button.on { border-color: #ececec; background: #ececec; color: #121212; }
  .plista { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
  .pgrade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; min-width: 0; }
  .pcard { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid #242424; background: #1c1c1c; color: #ececec; cursor: pointer; min-width: 0; overflow: hidden; }
  .pcard:hover { background: #242424; }
  .pcard.on { border-color: #2fd36b55; background: #1a221c; }
  .pcard .gr { font-size: 10px; letter-spacing: 1.5px; font-weight: 700; color: #5ab0f0; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #2fd36b; color: #0d1f14; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
  .pcard .nome { font-size: 12px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; text-transform: uppercase; }
  .pcard .preco { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .pcard .preco s { display: block; font-size: 11px; font-weight: 500; color: #7d8a96; }
  .pcard .preco.desc { color: #2fd36b; }
  .pcard .mais { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #3a4a5a; color: #5ab0f0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none; }
  .pcard.on .mais { background: #2fd36b; border-color: #2fd36b; color: #0d1f14; }

  .aside { display: flex; flex-direction: column; min-height: 0; border-radius: 18px; border: 1px solid #232323; background: #171717; overflow: hidden; }
  .aside .topo { padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .aside .rot-mesa { display: flex; flex-direction: column; flex-shrink: 0; max-width: 120px; }
  .aside .rot-mesa span { font-size: 10px; letter-spacing: 3px; color: #5ab0f0; font-weight: 700; }
  .aside .rot-mesa b { font-size: 30px; font-weight: 800; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aside .rolo { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .barra-sec { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-top: 1px solid #232323; flex-shrink: 0; }
  .barra-sec .pt { width: 6px; height: 6px; border-radius: 50%; }
  .barra-sec .t { font-size: 11px; letter-spacing: 2px; font-weight: 700; }
  .barra-sec .s { font-size: 12px; color: #7d8a96; }
  .barra-sec .dir { margin-left: auto; }
  .limpar { background: none; border: 0; color: #5ab0f0; font: 700 12px Manrope; cursor: pointer; padding: 0; }
  .limpar:hover { color: #f05252; }
  .cvazio { padding: 28px 10px; text-align: center; color: #6b747d; font-size: 13px; }
  .clin { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; margin: 0 8px; border-bottom: 1px solid #202020; }
  .clin:hover { background: #1d1d1d; }
  .clin .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ececec; }
  .clin .linha { display: flex; align-items: center; gap: 6px; }
  .clin .sb { width: 20px; height: 20px; border-radius: 5px; border: 1px solid #2c2c2c; background: transparent; color: #ececec; cursor: pointer; font-size: 11px; line-height: 1; padding: 0; flex: none; }
  .clin .sb:disabled { opacity: .3; cursor: default; }
  .clin .un { font-size: 11px; color: #9aa3ab; white-space: nowrap; }
  .clin .un b { color: #ececec; font-weight: 800; }
  .clin .tot { margin-left: auto; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .clin .tot.desc { color: #2fd36b; }
  .clin .obs { font-size: 11px; color: #ff9a2e; }
  .clin .obsin { width: 100%; height: 26px; padding: 0 8px; border: 0; border-bottom: 1px solid #2c2c2c; background: transparent; color: #ff9a2e; font: 500 12px Manrope; outline: none; }
  .clin .obsin:focus { border-color: #5ab0f0; }
  .clin .ico { width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; color: #6b747d; cursor: pointer; font-size: 12px; padding: 0; flex: none; }
  .clin .ico:hover { background: #242424; color: #ececec; }
  .clin .ico.x:hover { background: #2a1620; color: #f05252; }
  .clin.cancelado { opacity: .5; }
  .clin.cancelado .nm { text-decoration: line-through; }
  .pedh { display: flex; justify-content: space-between; padding: 8px 16px 2px; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #6b747d; }
  .pe { flex-shrink: 0; padding: 12px 16px 14px; border-top: 1px solid #232323; background: #151515; display: flex; flex-direction: column; gap: 10px; }
  .pe .tl { color: #5ab0f0; font-size: 12px; }
  .pe .tl b { color: #ececec; font-weight: 700; }
  .bp { height: 46px; border: 0; border-radius: 999px; font: 800 15px Manrope; cursor: pointer; white-space: nowrap; }
  .bp:disabled { opacity: .6; cursor: not-allowed; }
  .bp.verde { flex: 1; background: #2fd36b; color: #0d1f14; }
  .bp.verde:hover:not(:disabled) { background: #45e07e; }
  .bp.laranja { flex: 1; background: #ff9a2e; color: #1a1204; }
  .bp.contorno { flex: none; padding: 0 18px; border: 1px solid #4a3a1a; background: transparent; color: #ff9a2e; font-size: 14px; }
  .bp.nada { flex: 1; border: 1px solid #262626; background: transparent; color: #6b747d; cursor: not-allowed; }
  .clibox { position: relative; flex: 1; min-width: 0; }
  .cli { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 10px; background: #1d1d1d; color: inherit; text-align: left; cursor: pointer; }
  .cli:hover { background: #242424; }
  .cli .av { width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; }
  .clidrop { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 12px; border: 1px solid #2c2c2c; background: #1a1a1a; box-shadow: 0 16px 40px -12px rgba(0,0,0,.7); max-height: 320px; overflow: auto; }
  .cliop { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: #e4e4e4; font-weight: 600; font-size: 13px; cursor: pointer; text-align: left; }
  .cliop:hover { background: #242424; }
  .inp { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid #2c2c2c; background: #181818; color: #ececec; font: 500 13px Manrope; outline: none; width: 100%; }
  .inp:focus { border-color: #5ab0f0; }
  .rodape { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px 16px; }
  .bt { height: 46px; padding: 0 22px; border: 0; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
  .bt:disabled { opacity: .55; cursor: not-allowed; }
  .bt.verde { background: #2fd36b; color: #0d1f14; }
  .bt.verde:hover:not(:disabled) { background: #45e07e; }
  .bt.cont { background: transparent; border: 1px solid #2c2c2c; color: #9aa3ab; font-weight: 600; font-size: 14px; padding: 0 16px; }
  .bt.cont:hover { color: #fff; background: #242424; }
  .vazio { margin: 4px 16px 12px; padding: 28px 16px; border-radius: 14px; border: 1px dashed #2c2c2c; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .rot2 { font-size: 10px; font-weight: 700; letter-spacing: .18em; color: #9aa3ab; }
  .sech { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; }
  .sech .esq { display: flex; align-items: center; gap: 8px; }
  .sech .pt { width: 6px; height: 6px; border-radius: 50%; }
  .sech .s { font-size: 12px; color: #7d8a96; }
  .stepper { display: flex; align-items: center; flex: none; height: 32px; border-radius: 999px; background: #1d1d1d; }
  .stepper button { width: 32px; height: 32px; border: 0; background: transparent; color: #9aa3ab; font: 600 15px Manrope; cursor: pointer; border-radius: 50%; }
  .stepper button:hover { color: #fff; background: #242424; }
  .stepper span { min-width: 22px; text-align: center; font: 800 13px Manrope; }
  .stepper input { width: 46px; height: 28px; padding: 0; border: 1px solid #2c2c2c; border-radius: 8px; background: #181818; color: #f4f4f4; text-align: center; font: 800 14px Manrope; outline: none; }
  .stepper input:focus { border-color: #ff9a2e; }
  .cartl { display: flex; flex-direction: column; gap: 10px; padding: 12px 8px; border-bottom: 1px solid #232323; }
  .cartl .nm { font-size: 14px; font-weight: 600; line-height: 1.4; color: #ececec; }
  .obsin { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 0; border-bottom: 1px solid #2c2c2c; background: transparent; color: #ff9a2e; font: 500 13px Manrope; outline: none; }
  .xit { width: 26px; height: 26px; align-self: center; border: 0; border-radius: 7px; background: transparent; color: #6b747d; cursor: pointer; font-size: 14px; }
  .xit:hover { background: #2a1620; color: #f05252; }
  .menuctx { position: fixed; z-index: 70; min-width: 190px; padding: 6px; border-radius: 12px; border: 1px solid #2c2c2c; background: #1a1a1a; box-shadow: 0 16px 40px -12px rgba(0,0,0,.7); }
  .menuctx button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: #f05252; font-weight: 700; font-size: 13px; cursor: pointer; text-align: left; }
  .menuctx button:hover { background: #2a1620; }
  @media (max-width: 900px) {
    .main-mesa { grid-template-columns: 1fr; height: auto; padding: 12px; gap: 12px; }
    .plista { max-height: 60vh; }
    .aside .rolo { overflow: visible; }
  }

  /* login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #121212; }
  .login { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px; }
  .lcard { display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 20px; border: 1px solid #262626; background: #171717; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo > span { font-size: 12px; font-weight: 700; color: #9aa3ab; }
  .campo input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; background: #181818; color: #f4f4f4; font: 600 15px Manrope; outline: none; }
  .campo input:focus { border-color: #3b9be8 !important; }

  /* modal receber */
  .fundo { position: fixed; inset: 0; z-index: 50; background: rgba(4,8,18,.72); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { width: 100%; max-width: 480px; max-height: calc(100vh - 48px); overflow: auto; border-radius: 20px; border: 1px solid #2c2c2c; background: #171717; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); display: flex; flex-direction: column; }
  .metodos { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; padding: 4px; border-radius: 12px; background: #181818; border: 1px solid #262626; }
  .metodos button { height: 36px; border: 0; border-radius: 9px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .rapido { flex: none; white-space: nowrap; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid #2c2c2c; background: transparent; color: #d6d6d6; font-weight: 600; font-size: 12px; cursor: pointer; }
  .rapido:hover { background: #242424; color: #fff; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #181818; border: 1px solid #262626; }
  .x { width: 32px; height: 32px; border-radius: 9px; border: 1px solid #2c2c2c; background: transparent; color: #9aa3ab; font-size: 16px; cursor: pointer; }
  .x:hover { background: #242424; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px; background: #12233a; color: #ececec; font-weight: 600; font-size: 14px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.6); max-width: 92vw; }
  .toast .ic { width: 20px; height: 20px; border-radius: 50%; color: #04210f; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: none; }
  .carreg { color: #9aa3ab; padding: 40px; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
/* Mesas (web): garçom e caixa do restaurante pelo navegador, com o mesmo login do app Meu Giro.
   Abre mesa, cliente com tabela de preço, lança itens e recebe (dinheiro com troco, Pix, débito,
   crédito, várias formas), fechando no caixa do LinkPro. Relay -> agente Link (/api/salao/garcom). */
const { useState, useEffect, useCallback, useRef } = React;
const API = "https://raizestecnologia-relay.onrender.com/api";
const LS_TOKEN = "mg_mesas_token", LS_LOJA = "mg_mesas_loja", LS_DEV = "mg_mesas_device", LS_PASSE = "mg_mesas_passe";
// Modo LOCAL: página servida pelo agente da loja (http://IP-do-PC:8081/mesas). O login passa pelo relay
// só pra pegar o passe assinado; o garçom fala direto com o agente pela rede (funciona sem internet).
const LOCAL = location.pathname.startsWith("/api/local/");
const AGENTE = location.origin + "/api";
// Programa Meu Giro Mesas sem a rede da loja: abre o site com ?loja=<chave>&via=internet (fica nessa loja)
const PARAMS = new URLSearchParams(location.search);
const LOJA_FIXA = !LOCAL ? (PARAMS.get("loja") || "").replace(/\D/g, "") : "";
const VIA_INTERNET = !LOCAL && PARAMS.get("via") === "internet";

const store = {
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, manter = true) {
    try {
      localStorage.removeItem(k); sessionStorage.removeItem(k);
      if (v != null) (manter ? localStorage : sessionStorage).setItem(k, v);
    } catch (e) {}
  },
};
function deviceId() {
  let d = store.get(LS_DEV);
  if (!d) { d = "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set(LS_DEV, d); }
  return d;
}
let aoPerderPasse = () => {};
let aoPerderLogin = () => {}; // login salvo velho/vencido no relay: pede pra entrar de novo
function uuid() {
  if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
  const h = [...Array(32)].map(() => Math.floor(Math.random() * 16).toString(16));
  h[12] = "4"; h[16] = (8 + Math.floor(Math.random() * 4)).toString(16);
  const t = h.join("");
  return t.slice(0, 8) + "-" + t.slice(8, 12) + "-" + t.slice(12, 16) + "-" + t.slice(16, 20) + "-" + t.slice(20);
}
// Rota do modo local: "local" (rede da loja), "internet" (relay -> agente) ou "offline".
// Um monitor (App) testa as duas a cada 5s e troca sozinho; cada chamada também troca na hora se a rota falhar.
let rota = "local";
const rotaOuvintes = new Set();
/* Pode receber/fechar a conta? Vem do agente: permissão "finalizar atendimento" do usuário do LinkPro ligado ao login. */
let podeReceber = true;
function mudarRota(r) { if (r !== rota) { rota = r; rotaOuvintes.forEach((fn) => fn(r)); } }
async function chamar(url, { method = "GET", body, headers = {}, timeout }) {
  // sem resposta em `timeout` ms (rede caiu, servidor desligado): falha de conexão, não fica girando
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try {
    return await fetch(url, { method, signal: ctl.signal, headers: { "Content-Type": "application/json", ...headers }, body: body ? JSON.stringify(body) : undefined });
  } catch (err) {
    const e = new Error("A conexão com o servidor falhou."); e.rede = true; throw e;
  } finally { clearTimeout(timer); }
}
const falhaRede = () => { const e = new Error("A conexão com o servidor falhou."); e.rede = true; return e; };
// relay respondeu mas o agente da loja não está conectado nele (503) ou não respondeu (502/504)
const agenteForaNoRelay = (st) => st === 502 || st === 503 || st === 504;

async function api(path, { method = "GET", body, token, loja, timeout = 15000 } = {}) {
  // no modo local o garçom vai direto pro agente, com o passe; login/passe continuam no relay
  const garcom = LOCAL && path.startsWith("/salao/");
  const pelaInternet = { ...(token ? { Authorization: "Bearer " + token } : {}), ...(loja ? { "X-Empresa": loja } : {}) };
  let res, direto = garcom && (rota !== "internet" || !token);
  if (direto) {
    const passe = store.get(LS_PASSE);
    try {
      // com internet de reserva, não espera o tempo todo na rede local
      res = await chamar(AGENTE + path, { method, body, timeout: token ? Math.min(timeout, 3000) : timeout,
        headers: passe ? { Authorization: "Passe " + passe } : {} });
      mudarRota("local");
    } catch (e) {
      if (!token) { mudarRota("offline"); throw e; }
      direto = false; // rede local não respondeu: tenta pela internet
    }
  }
  if (!res) {
    try {
      res = await chamar(API + path, { method, body, timeout, headers: pelaInternet });
    } catch (e) {
      if (garcom) mudarRota("offline");
      throw e;
    }
    if (garcom) {
      if (agenteForaNoRelay(res.status)) { mudarRota("offline"); throw falhaRede(); }
      mudarRota("internet");
    }
  }
  if (direto && res.status === 401) aoPerderPasse();
  if (!direto && token && !path.startsWith("/auth/login")) {
    let msg = "";
    if (res.status === 403) { try { msg = (await res.clone().json()).message || ""; } catch (e) {} }
    // o login guarda as lojas de quando entrou: vínculo novo/removido depois disso dá "sem permissão"
    if (res.status === 401 || /permiss[aã]o para esta empresa/i.test(msg)) aoPerderLogin();
  }
  let json = {};
  try { json = await res.json(); } catch (e) {}
  if (!res.ok || json.success === false) { const e = new Error(json.message || "Falha na conexão (" + res.status + ")"); e.status = res.status; throw e; }
  return { data: json.data, message: json.message };
}
const num = (v) => { if (typeof v === "number") return v; let t = String(v ?? "").replace(/[^\d.,-]/g, ""); if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); return parseFloat(t) || 0; };
const nnum = (v) => (typeof v === "number" ? v : parseFloat(v) || 0); // vindo da API (ponto decimal)
const brl = (v) => "R$ " + (Math.round(v * 100) / 100).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const ago = (iso) => { const t = new Date(iso).getTime(); if (isNaN(t)) return ""; const m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + " min" : Math.floor(m / 60) + "h" + pad(m % 60); };
const qtdTxt = (q) => (Number.isInteger(nnum(q)) ? String(nnum(q)) : String(nnum(q)).replace(".", ","));
const iniciais = (n) => (n || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();

function Val({ preco, normal, qtd = 1, cls = "val" }) {
  const d = nnum(normal) > 0 && Math.abs(nnum(normal) - nnum(preco)) >= 0.005;
  return <span className={cls + (d ? " desc" : "")}>{d && <s>{brl(nnum(normal) * qtd)}</s>}{brl(nnum(preco) * qtd)}</span>;
}

/* ------------------------------------------------------------------ app */
/* pede o passe local ao relay (precisa de internet) */
async function pegarPasse(token, loja, manter) {
  const { data } = await api("/auth/passe-local", { method: "POST", token, loja });
  store.set(LS_PASSE, data.passe, manter);
  return data.passe;
}

/* pedidos de cancelamento esperando a aprovação deste usuário (quem pode aprovar também aprova pelo Mesas) */
function Aprovacoes({ token, avisar }) {
  const [lista, setLista] = useState([]), [aberto, setAberto] = useState(false), [busy, setBusy] = useState(null);
  const carregar = useCallback(async () => {
    try { setLista((await api("/cancelamentos/pendentes", { token })).data || []); } catch (e) {}
  }, [token]);
  useEffect(() => { carregar(); const t = setInterval(carregar, 10000); return () => clearInterval(t); }, [carregar]);
  async function decidir(s, aprovar) {
    setBusy(s.id);
    try {
      await api("/cancelamentos/" + s.id + "/decidir", { method: "POST", token, body: { aprovar } });
      avisar(aprovar ? "Cancelamento aprovado." : "Pedido recusado.");
    } catch (e) { avisar(e.message, true); }
    setBusy(null); carregar();
  }
  if (!lista.length) return null;
  return (<>
    <button className="hbtn" onClick={() => setAberto(true)} style={{ borderColor: "#6b2a2a", background: "#2a1620", color: "#ff8a8a" }}>
      Aprovar cancelamento <span style={{ minWidth: 20, height: 20, borderRadius: 10, background: "#f05252", color: "#fff", font: "700 11px Sora", display: "inline-flex", alignItems: "center", justifyContent: "center", padding: "0 6px" }}>{lista.length}</span>
    </button>
    {aberto && (
      <div className="fundo" onClick={() => setAberto(false)}>
        <div className="modal" style={{ maxWidth: 520 }} onClick={(e) => e.stopPropagation()}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 22px 12px" }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 19, color: "#f4f4f4" }}>Pedidos de cancelamento</span>
            <button className="x" onClick={() => setAberto(false)}>×</button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, padding: "0 22px 20px" }}>
            {lista.map((s) => (
              <div key={s.id} style={{ display: "flex", flexDirection: "column", gap: 8, padding: 14, borderRadius: 14, background: "#181818", border: "1px solid #262626" }}>
                <span style={{ fontSize: 12, color: "#9aa3ab" }}>{s.solicitante} · {s.lojaNome || s.loja} · {hhmm(s.criadoEm)}</span>
                <span style={{ fontSize: 14, fontWeight: 600, color: "#f4f4f4" }}>{s.descricao}</span>
                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                  <button className="bt cont" disabled={busy === s.id} onClick={() => decidir(s, false)}>Recusar</button>
                  <button className="bt" disabled={busy === s.id} onClick={() => decidir(s, true)} style={{ background: "#f05252", color: "#fff" }}>{busy === s.id ? "…" : "Aprovar e cancelar"}</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    )}
  </>);
}

function App() {
  const [token, setToken] = useState(store.get(LS_TOKEN));
  const [lojas, setLojas] = useState(null);
  const [loja, setLoja] = useState(store.get(LS_LOJA));
  const [info, setInfo] = useState(null); // modo local: {loja, nome, pronto}
  const [passe, setPasse] = useState(LOCAL ? store.get(LS_PASSE) : null);
  aoPerderPasse = () => { store.set(LS_PASSE, null); setPasse(null); };
  const [viaRota, setViaRota] = useState(rota);
  useEffect(() => { rotaOuvintes.add(setViaRota); return () => rotaOuvintes.delete(setViaRota); }, []);
  // monitor da conexão (modo local): a cada 5s vê se a rede local responde; se não, se o agente responde
  // pela internet (relay). Troca sozinho pra internet e volta sozinho pra rede local quando ela voltar.
  useEffect(() => {
    if (!LOCAL) return;
    let vivo = true;
    async function testar() {
      try {
        const r = await chamar(AGENTE + "/local/info", { timeout: 2500 });
        if (r.ok) { if (vivo) mudarRota("local"); return; }
      } catch (e) {}
      const tk = store.get(LS_TOKEN), lj = store.get(LS_LOJA) || (info && info.loja);
      if (!tk) { if (vivo) mudarRota("offline"); return; }
      try {
        const r = await chamar(API + "/empresas", { timeout: 5000, headers: { Authorization: "Bearer " + tk } });
        const j = await r.json().catch(() => ({}));
        const l = (j.data || []).find((x) => x.cnpj === lj);
        if (vivo) mudarRota(r.ok && l && l.online ? "internet" : "offline");
      } catch (e) { if (vivo) mudarRota("offline"); }
    }
    testar();
    const t = setInterval(testar, 5000);
    return () => { vivo = false; clearInterval(t); };
  }, [info]);
  const [mesa, setMesa] = useState(null);
  const [repo, setRepo] = useState(false); // tela "Reposição pra cozinha"
  const [toast, setToast] = useState(null);
  const tt = useRef(null);
  const avisar = (msg, err = false) => { clearTimeout(tt.current); setToast({ msg, err }); tt.current = setTimeout(() => setToast(null), 3200); };
  const sair = () => { store.set(LS_TOKEN, null); store.set(LS_PASSE, null); setToken(null); setPasse(null); setLojas(null); setMesa(null); };
  aoPerderLogin = () => { sair(); avisar("Seu acesso mudou. Entre de novo.", true); };

  // modo local: a loja é a do agente; renova o passe quando tem internet
  useEffect(() => {
    if (!LOCAL) return;
    fetch(AGENTE + "/local/info").then((r) => r.json()).then((j) => {
      const d = j.data || {};
      setInfo(d); setLojas([{ cnpj: d.loja, nome: d.nome, online: true }]); setLoja(d.loja);
      if (token && d.loja) pegarPasse(token, d.loja, true).then(setPasse).catch(() => {});
    }).catch(() => setInfo({ erro: true }));
  }, []);

  useEffect(() => {
    if (!token || LOCAL) return;
    api("/empresas", { token }).then(({ data }) => {
      const l = data || [];
      setLojas(l);
      if (LOJA_FIXA) {
        if (l.some((x) => x.cnpj === LOJA_FIXA)) { setLoja(LOJA_FIXA); store.set(LS_LOJA, LOJA_FIXA); }
        else { setLojas([]); avisar("Seu usuário não tem acesso à loja deste computador.", true); }
        return;
      }
      if (!loja || !l.some((x) => x.cnpj === loja)) { const p = l[0]; if (p) { setLoja(p.cnpj); store.set(LS_LOJA, p.cnpj); } }
    }).catch((e) => { if (e.status === 401) sair(); else avisar(e.message, true); });
  }, [token]);

  if (LOCAL && !info) return <div className="login-wrap"><div className="carreg">Conectando ao agente da loja…</div></div>;
  if (LOCAL && (info.erro || !info.pronto)) return (
    <div className="login-wrap"><div className="lcard" style={{ maxWidth: 420 }}>
      <span className="sora" style={{ fontWeight: 700, fontSize: 18 }}>Modo local ainda não configurado</span>
      <span style={{ fontSize: 14, color: "#9aa3ab" }}>O agente desta loja precisa conectar na internet uma vez pra receber a configuração. Confira a internet do computador do agente e recarregue a página.</span>
    </div></div>
  );
  if (!token || (LOCAL && !passe)) return <Login onOk={async (t, manter) => {
    if (LOCAL) { const p = await pegarPasse(t, info.loja, manter); setPasse(p); }
    store.set(LS_TOKEN, t, manter); setToken(t);
  }} />;
  const lojaAtual = (lojas || []).find((l) => l.cnpj === loja);
  const ctx = { token, loja, avisar };
  return (
    <div className="fundo-app">
      <header className={"hdr" + (LOCAL && viaRota !== "local" ? " " + viaRota : VIA_INTERNET ? " internet" : "")}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div className="logo">&lt;v/&gt;</div>
          <div className="marca"><b>Meu Giro</b><small>MESAS</small></div>
        </div>
        {repo && !mesa && (<><div className="sep" /><button className="hbtn" onClick={() => setRepo(false)}>← Mesas</button></>)}
        <div style={{ flex: 1 }} />
        {LOCAL && (viaRota === "local"
          ? <span className="pill" style={{ background: "rgba(59,155,232,.12)", color: "#5aaef0" }}><i style={{ background: "#3b9be8" }} />Rede local</span>
          : viaRota === "internet"
            ? <span className="pill" style={{ background: "rgba(245,165,36,.16)", color: "#f5a524" }}><i style={{ background: "#f5a524" }} />Pela internet</span>
            : <span className="pill" style={{ background: "rgba(240,82,82,.16)", color: "#f05252" }}><i style={{ background: "#f05252" }} />Sem conexão</span>)}
        {VIA_INTERNET && <span className="pill" style={{ background: "rgba(245,165,36,.16)", color: "#f5a524" }}><i style={{ background: "#f5a524" }} />Pela internet</span>}
        {lojas && lojas.length > 0 && (
          <div className="loja">
            <span className="av">{iniciais(lojaAtual ? lojaAtual.nome : "")}</span>
            <select disabled={LOCAL || !!LOJA_FIXA} value={loja || ""} onChange={(e) => { setLoja(e.target.value); store.set(LS_LOJA, e.target.value); setMesa(null); }}>
              {lojas.map((l) => <option key={l.cnpj} value={l.cnpj}>{(l.nome || l.cnpj) + (l.online ? "" : " (offline)")}</option>)}
            </select>
          </div>
        )}
        <Aprovacoes token={token} avisar={avisar} />
        <button className="hbtn ghost" onClick={sair}>Sair</button>
      </header>
      {VIA_INTERNET && (
        <div className="faixa internet"><i />Sem comunicação com o servidor pela rede da loja. Funcionando pela internet até a rede voltar.</div>
      )}
      {LOCAL && viaRota === "internet" && (
        <div className="faixa internet"><i />Sem comunicação pela rede local. Funcionando pela internet até a rede voltar.</div>
      )}
      {LOCAL && viaRota === "offline" && (
        <div className="faixa offline"><i />Sem conexão com o servidor (rede local e internet). Os pedidos ficam salvos aqui até voltar.</div>
      )}
      {!loja ? <div className="carreg">Carregando lojas…</div>
        : mesa ? <Mesa key={(mesa.tipo || "mesa") + (mesa.idMesa || mesa.numero || mesa.idAtendimento || "novo")} {...ctx} mesa={mesa} voltar={() => setMesa(null)} />
        : repo ? <Reposicao {...ctx} voltar={() => setRepo(false)} />
        : <Salao {...ctx} abrir={setMesa} reposicao={() => setRepo(true)} />}
      {toast && (
        <div className="toast" style={{ border: "1px solid " + (toast.err ? "#6b2a2a" : "#1f6b3e") }}>
          <span className="ic" style={{ background: toast.err ? "#f05252" : "#2fd36b" }}>{toast.err ? "!" : "✓"}</span>{toast.msg}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ login */
function Login({ onOk }) {
  const [user, setUser] = useState(""), [pass, setPass] = useState("");
  const [show, setShow] = useState(false), [manter, setManter] = useState(true);
  const [erro, setErro] = useState(""), [busy, setBusy] = useState(false);
  async function entrar(e) {
    e.preventDefault();
    if (!user.trim() || !pass) { setErro("Preencha usuário e senha."); return; }
    setBusy(true); setErro("");
    try {
      const { data } = await api("/auth/login", { method: "POST", body: { email: user.trim(), senha: pass, deviceId: deviceId(), deviceNome: "Navegador (Mesas)" } });
      await onOk(data.token, manter);
    } catch (er) {
      setErro(er instanceof TypeError ? "Sem internet: neste computador é preciso entrar uma vez com internet. Depois funciona sem." : er.message);
    }
    setBusy(false);
  }
  const borda = "1px solid " + (erro ? "#6b2a2a" : "#2c2c2c");
  return (
    <div className="login-wrap">
      <form className="login" onSubmit={entrar}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, textAlign: "center" }}>
          <div className="logo" style={{ width: 56, height: 56, borderRadius: 16, fontSize: 16 }}>&lt;v/&gt;</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 26, letterSpacing: "-.02em", color: "#f4f4f4" }}>Meu Giro</span>
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".16em", color: "#f5a524" }}>MESAS</span>
          </div>
        </div>
        <div className="lcard">
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 18, color: "#f4f4f4" }}>Entrar</span>
            <span style={{ fontSize: 13, color: "#9aa3ab" }}>Use o mesmo usuário e senha do app Meu Giro.</span>
          </div>
          <label className="campo"><span>Usuário</span>
            <input value={user} onChange={(e) => { setUser(e.target.value); setErro(""); }} placeholder="usuário ou e-mail" autoComplete="username" style={{ border: borda }} autoFocus />
          </label>
          <label className="campo"><span>Senha</span>
            <div style={{ position: "relative" }}>
              <input type={show ? "text" : "password"} value={pass} onChange={(e) => { setPass(e.target.value); setErro(""); }} placeholder="••••••" autoComplete="current-password" style={{ border: borda, paddingRight: 72 }} />
              <button type="button" onClick={() => setShow(!show)} style={{ position: "absolute", right: 6, top: 6, height: 34, padding: "0 10px", border: 0, borderRadius: 9, background: "transparent", color: "#5aaef0", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>{show ? "Ocultar" : "Mostrar"}</button>
            </div>
          </label>
          {erro && <span style={{ fontSize: 13, fontWeight: 600, color: "#f05252" }}>{erro}</span>}
          <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", fontSize: 13, color: "#d6d6d6" }} onClick={(e) => { e.preventDefault(); setManter(!manter); }}>
            <span style={{ width: 20, height: 20, flex: "none", borderRadius: 6, border: "1px solid " + (manter ? "#2fd36b" : "#333333"), background: manter ? "#2fd36b" : "#181818", color: "#04210f", fontSize: 12, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" }}>{manter ? "✓" : ""}</span>
            Manter conectado neste dispositivo
          </label>
          <button type="submit" className="bt verde" disabled={busy} style={{ height: 48 }}>{busy ? "Entrando…" : "Entrar"}</button>
        </div>
        <span style={{ textAlign: "center", fontSize: 13, color: "#7d8a96" }}>Esqueceu a senha? Fale com o gerente da loja.</span>
      </form>
    </div>
  );
}

/* ------------------------------------------------------------------ salão (mesas, comandas, avulsos) */
// Rótulo/título de cada tipo de atendimento: mesa, comanda (cadastrada no LinkPro) ou avulso (balcão).
function rotulo(a) {
  if (a.tipo === "comanda") return { rot: "COMANDA", num: pad(a.numero), titulo: "Comanda " + pad(a.numero) };
  if (a.tipo === "avulso") {
    const n = (a.nome || "").trim() || (a.numeroAtendimento ? "#" + a.numeroAtendimento : "Novo");
    return { rot: "AVULSO", num: n, titulo: "Avulso " + n };
  }
  return { rot: "MESA", num: pad(a.numero), titulo: "Mesa " + pad(a.numero) };
}

function CardAt({ rot, num, oc, total, meta, onClick }) {
  const ac = oc ? "#f5a524" : "#2fd36b";
  return (
    <button className="card" onClick={onClick}
      style={{ border: "1px solid " + (oc ? "#3a3220" : "#173a2b"), background: oc ? "linear-gradient(180deg,#16203a,#111a30)" : "#181818" }}>
      <div className="barra" style={{ background: ac }} />
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 2, minWidth: 0 }}>
          <span className="rot">{rot}</span>
          <span className="num" style={String(num).length > 4 ? { fontSize: 22, lineHeight: 1.15, wordBreak: "break-word" } : null}>{num}</span>
        </div>
        <span className="pill" style={{ background: oc ? "rgba(245,165,36,.12)" : "rgba(34,197,94,.12)", color: ac }}><i style={{ background: ac }} />{oc ? "Ocupada" : "Livre"}</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 3, minWidth: 0 }}>
        <span className="sora" style={{ fontWeight: 600, fontSize: 17, color: oc ? "#f4f4f4" : "#9aa3ab" }}>{oc ? brl(nnum(total)) : "Disponível"}</span>
        <span style={{ fontSize: 12, color: "#7d8a96", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{meta}</span>
      </div>
    </button>
  );
}
const metaAt = (m) => [m.cliente, nnum(m.itens) ? qtdTxt(m.itens) + (nnum(m.itens) > 1 ? " itens" : " item") : "sem itens", m.abertura ? "há " + ago(m.abertura) : ""].filter(Boolean).join(" · ");

/* novo avulso: digita o nome livre OU escolhe um cliente cadastrado (aplica a tabela de preço dele) */
function NovoAvulso({ token, loja, fechar, abrir }) {
  const [nome, setNome] = useState(""), [lista, setLista] = useState(null);
  const deb = useRef(null);
  useEffect(() => {
    clearTimeout(deb.current);
    if (nome.trim().length < 2) { setLista(null); return; }
    deb.current = setTimeout(async () => {
      try { setLista((await api("/salao/garcom/clientes?q=" + encodeURIComponent(nome.trim()), { token, loja })).data || []); }
      catch (e) { setLista([]); }
    }, 300);
  }, [nome]);
  const cliente = (c) => abrir({ tipo: "avulso", nome: c.nome, idCliente: c.id, clienteNome: c.nome, tabela: c.tabela || "", cadastrado: true });
  // nome igual ao de um cadastrado (ou Enter com sugestões): vai pro cliente, com a tabela de preço dele
  const igual = (lista || []).find((c) => (c.nome || "").trim().toLowerCase() === nome.trim().toLowerCase());
  const livre = () => (igual ? cliente(igual) : abrir({ tipo: "avulso", nome: nome.trim() }));
  const enter = () => (igual ? cliente(igual) : lista && lista.length ? cliente(lista[0]) : livre());
  return (
    <div className="fundo" onClick={fechar}>
      <div className="modal" style={{ maxWidth: 460 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, padding: "22px 22px 8px" }}>
          <span className="sora" style={{ fontWeight: 700, fontSize: 20, color: "#f4f4f4" }}>Novo avulso</span>
          <span style={{ fontSize: 13, color: "#9aa3ab" }}>Atendimento no balcão, sem mesa. Digite o nome ou escolha um cliente cadastrado (opcional).</span>
          <input className="inp" style={{ height: 46, fontSize: 15 }} autoFocus maxLength={60} placeholder="Nome ou cliente cadastrado (nome, CPF/CNPJ)" value={nome}
            onChange={(e) => setNome(e.target.value)} onKeyDown={(e) => e.key === "Enter" && enter()} />
          {lista && (
            <div style={{ display: "flex", flexDirection: "column", gap: 2, maxHeight: 240, overflow: "auto", borderRadius: 12, background: "#181818", border: "1px solid #262626", padding: 4 }}>
              {!lista.length && <div style={{ padding: "8px 12px", fontSize: 13, color: "#9aa3ab" }}>Nenhum cliente cadastrado com esse nome. Pode abrir só com o nome.</div>}
              {lista.map((c, i) => (
                <button key={c.id} className="cliop" onClick={() => cliente(c)}
                  style={(igual ? igual.id === c.id : i === 0) ? { background: "#242424", boxShadow: "inset 3px 0 0 #3b9be8" } : null}>
                  <span>{c.nome}{c.documento ? <span style={{ color: "#7d8a96", fontWeight: 500 }}> · {c.documento}</span> : null}</span>
                  <span style={{ fontSize: 12, fontWeight: 500, color: "#7d8a96", whiteSpace: "nowrap" }}>{c.tabela ? "Tabela " + c.tabela : "cadastrado"}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="rodape" style={{ justifyContent: "space-between", padding: "14px 22px 22px" }}>
          <button className="bt cont" onClick={fechar}>Cancelar</button>
          <button className="bt verde" onClick={livre}>{igual ? "Abrir com " + igual.nome : nome.trim() ? "Abrir só com o nome" : "Abrir avulso"}</button>
        </div>
      </div>
    </div>
  );
}

function Salao({ token, loja, avisar, abrir, reposicao }) {
  const [dados, setDados] = useState(null), [erro, setErro] = useState(""), [filtro, setFiltro] = useState("Todas");
  const [aba, setAba] = useState(null);
  const [numCmd, setNumCmd] = useState("");
  const [novoAvulso, setNovoAvulso] = useState(null); // nome digitado (modal aberto quando != null)
  const carregar = useCallback(async () => {
    try { const { data } = await api("/salao/garcom/mesas", { token, loja }); podeReceber = !data || data.podeReceber !== false; setDados(data || {}); setErro(""); }
    catch (e) { setErro(e.status === 404 ? "Esta loja não tem o restaurante (agente Link) ou o agente precisa ser atualizado." : e.message); }
  }, [token, loja]);
  useEffect(() => { setDados(null); carregar(); const t = setInterval(carregar, 15000); return () => clearInterval(t); }, [carregar]);

  if (erro && !dados) return <div className="carreg" style={{ color: "#f05252" }}>{erro}</div>;
  if (!dados) return <div className="carreg">Carregando…</div>;
  const mesas = dados.mesas || [], comandas = dados.comandas || [], avulsos = dados.avulsos || [];
  const tab = aba === "avulsos" ? "avulsos" : dados.usaComanda ? "comandas" : "mesas";
  const lista = tab === "mesas" ? mesas : tab === "comandas" ? comandas : avulsos;
  const ocupadas = lista.filter((m) => m.idAtendimento);
  const aberto = [...mesas, ...comandas, ...avulsos].filter((m) => m.idAtendimento).reduce((s, m) => s + nnum(m.total), 0);
  const filtros = [["Todas", lista.length, "#3b9be8"], ["Livres", lista.length - ocupadas.length, "#2fd36b"], ["Ocupadas", ocupadas.length, "#f5a524"]];
  const vis = lista.filter((m) => filtro === "Todas" || (filtro === "Livres" ? !m.idAtendimento : !!m.idAtendimento));
  // no LinkPro a loja usa mesa OU comanda (dados_empresa.comanda_ou_mesa); avulso sempre
  const abas = [dados.usaComanda ? ["comandas", "Comandas", comandas.filter((m) => m.idAtendimento).length]
    : ["mesas", "Mesas", mesas.filter((m) => m.idAtendimento).length], ["avulsos", "Avulsos", avulsos.length]];

  function abrirComanda() {
    const n = parseInt(numCmd, 10);
    if (!n) return;
    const c = comandas.find((x) => x.numero === n);
    if (!c) { avisar("Comanda " + n + " não está cadastrada no LinkPro.", true); return; }
    setNumCmd("");
    abrir({ ...c, tipo: "comanda" });
  }
  return (
    <main className="main-mesas">
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <h1 className="h1">Salão</h1>
          <span className="resumo">{[mesas, comandas, avulsos].reduce((s, l) => s + l.filter((m) => m.idAtendimento).length, 0)} em atendimento · {brl(aberto)} em aberto</span>
        </div>
        <button className="hbtn" onClick={reposicao} style={{ height: 44, borderColor: "#4a3a1a", color: "#f5a524" }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16" /><path d="M3 21v-5h5" /></svg>
          Reposição pra cozinha
        </button>
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <div className="abas" style={{ gap: 26 }}>
          {abas.map(([k, l, n]) => <button key={k} className={tab === k ? "on" : ""} onClick={() => { setAba(k); setFiltro("Todas"); }} style={{ fontSize: 16 }}>{l}{n ? <span style={{ marginLeft: 6, fontFamily: "Sora", fontSize: 12, color: "#f5a524" }}>{n}</span> : null}</button>)}
        </div>
        {tab === "comandas" && (
          <div style={{ display: "flex", gap: 8 }}>
            <input className="inp" style={{ width: 150, height: 44, fontSize: 15 }} inputMode="numeric" placeholder="Nº da comanda" value={numCmd}
              onChange={(e) => setNumCmd(e.target.value.replace(/\D/g, ""))} onKeyDown={(e) => e.key === "Enter" && abrirComanda()} />
            <button className="bt verde" style={{ height: 44 }} onClick={abrirComanda}>Abrir</button>
          </div>
        )}
        {tab === "avulsos" && <button className="bt verde" style={{ height: 44 }} onClick={() => setNovoAvulso("")}>+ Novo avulso</button>}
        {tab !== "avulsos" && (
          <div className="filtros">
            {filtros.map(([l, c, dot]) => (
              <button key={l} onClick={() => setFiltro(l)} style={{ background: filtro === l ? "#2a2a2a" : "transparent", color: filtro === l ? "#fff" : "#9aa3ab" }}>
                <span className="dot" style={{ background: dot }} />{l}<span className="cnt">{c}</span>
              </button>
            ))}
          </div>
        )}
      </div>

      {!lista.length ? (
        <div className="vazio" style={{ margin: 0 }}>
          {tab === "mesas" ? "Nenhuma mesa ativa. Ative as mesas no LinkPro." : tab === "comandas" ? "Nenhuma comanda cadastrada no LinkPro." : "Nenhum avulso aberto. Toque em + Novo avulso pra atender no balcão."}
        </div>
      ) : (
        <div className="grade">
          {vis.map((m) => {
            const tipo = tab === "mesas" ? "mesa" : tab === "comandas" ? "comanda" : "avulso";
            const r = rotulo({ ...m, tipo, nome: m.cliente });
            return <CardAt key={tipo + (m.idMesa || m.idComanda || m.idAtendimento)} rot={r.rot} num={r.num} oc={!!m.idAtendimento} total={m.total}
              meta={m.idAtendimento ? metaAt(m) : "Toque para abrir"} onClick={() => abrir({ ...m, tipo, nome: tipo === "avulso" ? m.cliente : undefined })} />;
          })}
        </div>
      )}

      {novoAvulso != null && <NovoAvulso token={token} loja={loja} fechar={() => setNovoAvulso(null)} abrir={(x) => { setNovoAvulso(null); abrir(x); }} />}
    </main>
  );
}

/* ------------------------------------------------------------------ mesa */
function Mesa({ token, loja, avisar, mesa, voltar }) {
  const [idAt, setIdAt] = useState(mesa.idAtendimento || null);
  const [com, setCom] = useState(null);
  const [cli, setCli] = useState({ id: mesa.idCliente || null, nome: mesa.clienteNome || "", tabela: mesa.tabela || "" });
  const [cliAberto, setCliAberto] = useState(false);
  // carrinho fica salvo no aparelho até o servidor confirmar: caiu a conexão, fechou a tela, nada se perde
  const tipo = mesa.tipo || "mesa";
  const chaveCart = "mg_mesas_cart_" + loja + "_" + (tipo === "mesa" ? mesa.idMesa : tipo === "comanda" ? "c" + mesa.numero : "a" + (mesa.idAtendimento || "novo"));
  const salvo = (() => { try { return JSON.parse(store.get(chaveCart) || "null"); } catch (e) { return null; } })();
  const [cart, setCart] = useState((salvo && salvo.itens) || []);
  const pendente = useRef((salvo && salvo.codigo) || null); // código do pedido ainda não confirmado
  const [busy, setBusy] = useState(false);
  const [falha, setFalha] = useState(false);
  const [cancelando, setCancelando] = useState(null); // item já lançado que vai cancelar/diminuir
  const [menu, setMenu] = useState(null); // botão direito: {x, y, rotulo, acao}
  const abrirMenu = (e, rotulo, acao) => { e.preventDefault(); setMenu({ x: Math.min(e.clientX, innerWidth - 210), y: Math.min(e.clientY, innerHeight - 70), rotulo, acao }); };
  useEffect(() => {
    if (!menu) return;
    const fecha = () => setMenu(null);
    addEventListener("click", fecha); addEventListener("scroll", fecha, true); addEventListener("keydown", fecha);
    return () => { removeEventListener("click", fecha); removeEventListener("scroll", fecha, true); removeEventListener("keydown", fecha); };
  }, [menu]);
  const [pagar, setPagar] = useState(false);
  useEffect(() => {
    store.set(chaveCart, cart.some((c) => !c.cancelado) ? JSON.stringify({ itens: cart, codigo: pendente.current }) : null);
  }, [cart]);

  const carregar = useCallback(async (id = idAt) => {
    if (!id) return;
    try {
      const { data } = await api("/salao/garcom/atendimento/" + id, { token, loja });
      setCom(data); setCli((x) => ({ ...x, id: data.idCliente ?? null, nome: data.cliente || "" }));
    } catch (e) { avisar(e.message, true); }
  }, [idAt, token, loja]);
  useEffect(() => { carregar(); }, []);

  const rot = rotulo({ ...mesa, tipo, numeroAtendimento: (com && com.numeroAtendimento) || mesa.numeroAtendimento, nome: mesa.nome || (com && com.nome) });
  const itens = ((com && com.itens) || []).filter((i) => !i.cancelado);
  const total = itens.reduce((s, i) => s + nnum(i.qtd) * nnum(i.preco), 0);
  const qtdItens = itens.reduce((s, i) => s + nnum(i.qtd), 0);
  // agrupa por envio (codigo_pedido), na ordem em que chegaram
  const pedidos = [];
  itens.forEach((i) => {
    let p = pedidos.find((x) => x.k === (i.pedido || i.id));
    if (!p) { p = { k: i.pedido || i.id, hora: i.hora, linhas: [] }; pedidos.push(p); }
    p.linhas.push(i);
  });
  const aberta = !com || com.aberto !== false;
  const ativos = cart.filter((c) => !c.cancelado); // tirados (com autorização) ficam riscados e vão como cancelados
  const cartTotal = ativos.reduce((s, c) => s + c.qtd * c.preco, 0);
  const cartQtd = ativos.reduce((s, c) => s + c.qtd, 0);
  const [autorizar, setAutorizar] = useState(null); // {titulo, texto, ok(quem)}
  const ocupada = !!idAt && itens.length > 0;
  const ac = ocupada ? "#f5a524" : "#2fd36b";

  async function precosDoCarrinho(idCli) {
    if (!cart.length) return;
    try {
      const ids = [...new Set(cart.map((c) => c.id))].join(",");
      const { data } = await api("/salao/garcom/produtos?ids=" + ids + (idCli ? "&idCliente=" + idCli : ""), { token, loja });
      const m = Object.fromEntries((data || []).map((p) => [p.id, p]));
      setCart((cs) => cs.map((c) => (m[c.id] ? { ...c, preco: nnum(m[c.id].preco), normal: nnum(m[c.id].precoNormal) } : c)));
    } catch (e) {}
  }
  async function escolherCliente(c) {
    setCliAberto(false);
    const id = c ? c.id : null;
    if (id === cli.id) return;
    try {
      if (idAt) await api("/salao/garcom/atendimento/" + idAt + "/cliente", { method: "POST", token, loja, body: { idCliente: id } });
      setCli({ id, nome: c ? c.nome : "", tabela: c ? c.tabela : "" });
      await precosDoCarrinho(id); await carregar();
    } catch (e) { avisar(e.message, true); }
  }
  function add(p) {
    setCart((cs) => {
      const i = cs.findIndex((c) => c.id === p.id && !c.obs && !c.cancelado);
      if (i >= 0) { const n = [...cs]; n[i] = { ...n[i], qtd: n[i].qtd + 1 }; return n; }
      return [...cs, { id: p.id, nome: p.descricao, preco: nnum(p.preco), normal: nnum(p.precoNormal), qtd: 1, obs: "" }];
    });
  }
  async function enviar() {
    if (!ativos.length || busy) return;
    // mesmo código no reenvio: se o primeiro chegou e só a resposta se perdeu, o agente não lança de novo
    if (!pendente.current) pendente.current = uuid();
    store.set(chaveCart, JSON.stringify({ itens: cart, codigo: pendente.current }));
    setBusy(true); setFalha(false);
    try {
      const { data } = await api("/salao/garcom/pedido", { method: "POST", token, loja, timeout: 6000, body: {
        idAtendimento: idAt || undefined, idCliente: cli.id || undefined,
        ...(idAt ? {} : tipo === "mesa" ? { idMesa: mesa.idMesa } : tipo === "comanda" ? { comanda: mesa.numero } : { avulso: true, nome: mesa.cadastrado ? undefined : mesa.nome || undefined }),
        codigoPedido: pendente.current,
        itens: cart.map((c) => ({ idProduto: c.id, qtd: c.qtd, ...(c.obs.trim() ? { obs: c.obs.trim() } : {}), ...(c.cancelado ? { cancelado: true } : {}) })) } });
      pendente.current = null;
      setIdAt(data.idAtendimento); setCart([]);
      avisar((data.repetido ? "Pedido já tinha chegado · " : "Pedido enviado · ") + rotulo({ ...mesa, tipo }).titulo);
      await carregar(data.idAtendimento);
    } catch (e) {
      if (e.rede) setFalha(true);
      else { pendente.current = null; avisar(e.message, true); }
    }
    setBusy(false);
  }

  const sec = (cor, rot, sub, dir) => (
    <div className="sech">
      <div className="esq"><span className="pt" style={{ background: cor }} /><span className="rot2">{rot}</span><span className="s">{sub}</span></div>
      {dir}
    </div>
  );
  const nItens = (n) => (n ? qtdTxt(n) + (n > 1 ? " itens" : " item") : "");

  const [editObs, setEditObs] = useState(null); // linha do pedido novo com a observação aberta
  const tirarNovo = (c, idx) => setAutorizar({
    titulo: "Cancelar item", texto: c.qtd + "× " + c.nome,
    ok: (por) => setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, cancelado: true, por } : x))) });
  const corStatus = !aberta ? ["#0f2a3a", "#5ab0f0"] : ocupada ? ["#2e2410", "#ff9a2e"] : ["#0f2a1a", "#2fd36b"];

  return (
    <main className={"main-mesa" + (aberta ? "" : " so-aside")}>
      {aberta ? <Produtos token={token} loja={loja} idCliente={cli.id} cart={cart} onAdd={add} voltar={voltar} /> : null}

      <aside className="aside">
        <div className="topo">
          <div className="rot-mesa" title={rot.titulo}><span>{rot.rot}</span><b style={rot.num.length > 4 ? { fontSize: 18 } : null}>{rot.num}</b></div>
          <ClienteBox cli={cli} aberto={cliAberto} podeMexer={aberta} token={token} loja={loja}
            toggle={() => setCliAberto(!cliAberto)} escolher={escolherCliente} />
          <span title={com && com.abertura ? "aberta há " + ago(com.abertura) : ""} style={{ display: "flex", alignItems: "center", gap: 5, padding: "4px 10px", borderRadius: 999, background: corStatus[0], color: corStatus[1], fontSize: 12, fontWeight: 700, flexShrink: 0 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: corStatus[1] }} />{aberta ? (ocupada ? "Ocupada" : "Livre") : "Fechada"}
          </span>
        </div>

        {aberta && (
          <div className="barra-sec">
            <span className="pt" style={{ background: "#2fd36b" }} /><span className="t" style={{ color: "#2fd36b" }}>PEDIDO NOVO</span>
            <span className="s">{nItens(cartQtd)}</span>
            {ativos.length > 0 && <button className="limpar dir" onClick={() => setAutorizar({
              titulo: "Limpar o pedido", texto: "Tira todos os itens do pedido novo.",
              ok: () => { pendente.current = null; setCart([]); } })}>Limpar</button>}
          </div>
        )}

        <div className="rolo">
          {aberta && (!cart.length ? <div className="cvazio">Toque em um produto para adicionar</div> : cart.map((c, idx) => (
            c.cancelado ? (
              <div className="clin cancelado" key={idx} title={c.nome}>
                <span className="nm">{c.qtd}× {c.nome}</span>
                <span style={{ fontSize: 10, fontWeight: 800, color: "#f05252" }}>CANCELADO{c.por ? " · " + c.por : ""}</span>
              </div>
            ) : (
              <div className="clin" key={idx} title={c.nome} onContextMenu={(e) => abrirMenu(e, "Cancelar item", () => tirarNovo(c, idx))}>
                <span className="nm">{c.nome}</span>
                <div className="linha">
                  {/* como no LinkPro: diminui até 1; tirar o item é "cancelar" (com autorização) */}
                  <button className="sb" disabled={c.qtd <= 1} onClick={() => setCart((cs) => cs.map((x, j) => (j === idx && x.qtd > 1 ? { ...x, qtd: x.qtd - 1 } : x)))}>−</button>
                  <span className="un"><b>{c.qtd}</b> UN × {brl(c.preco)}</span>
                  <button className="sb" onClick={() => setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, qtd: x.qtd + 1 } : x)))}>+</button>
                  <button className="ico" title="Observação" onClick={() => setEditObs(editObs === idx ? null : idx)} style={c.obs ? { color: "#ff9a2e" } : null}>✎</button>
                  <span className={"tot" + (nnum(c.normal) > 0 && Math.abs(nnum(c.normal) - c.preco) >= 0.005 ? " desc" : "")}>{brl(c.qtd * c.preco)}</span>
                  <button className="ico x" title="Cancelar item (precisa de autorização)" onClick={() => tirarNovo(c, idx)}>✕</button>
                </div>
                {editObs === idx
                  ? <input className="obsin" autoFocus value={c.obs} placeholder="Observação (ex.: sem gelo)" maxLength={200}
                      onChange={(e) => { const v = e.target.value; setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, obs: v } : x))); }}
                      onKeyDown={(e) => e.key === "Enter" && setEditObs(null)} onBlur={() => setEditObs(null)} />
                  : c.obs ? <span className="obs">{c.obs}</span> : null}
              </div>
            )
          )))}

          {itens.length > 0 && (<>
            <div className="barra-sec" style={{ marginTop: aberta ? 8 : 0 }}>
              <span className="pt" style={{ background: "#ff9a2e" }} /><span className="t" style={{ color: "#ff9a2e" }}>JÁ NA MESA</span>
              <span className="s">{nItens(qtdItens)}</span>
              <span className="dir" style={{ fontSize: 12, fontWeight: 800, color: "#ff9a2e" }}>{brl(total)}</span>
            </div>
            {pedidos.map((p, i) => (
              <div key={p.k}>
                <div className="pedh"><span>PEDIDO {i + 1}</span><span style={{ letterSpacing: 0 }}>{hhmm(p.hora)}</span></div>
                {p.linhas.map((l) => (
                  <div className="clin" key={l.id} title={l.descricao} onContextMenu={(e) => aberta && abrirMenu(e, "Cancelar / diminuir item", () => setCancelando(l))}>
                    <span className="nm">{l.descricao}</span>
                    <div className="linha">
                      <span className="un"><b>{qtdTxt(l.qtd)}</b> UN × {brl(nnum(l.preco))}</span>
                      <span className={"tot" + (nnum(l.precoNormal) > 0 && Math.abs(nnum(l.precoNormal) - nnum(l.preco)) >= 0.005 ? " desc" : "")}>{brl(nnum(l.qtd) * nnum(l.preco))}</span>
                      {aberta && <button className="ico x" title="Cancelar ou diminuir (precisa de autorização)" onClick={() => setCancelando(l)}>✕</button>}
                    </div>
                    {l.obs && <span className="obs">{l.obs}</span>}
                  </div>
                ))}
              </div>
            ))}
          </>)}
          {!aberta && <div className="cvazio" style={{ color: "#2fd36b", fontWeight: 600 }}>Mesa fechada no caixa.</div>}
        </div>

        <div className="pe">
          <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 12 }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              <span className="tl">Na mesa <b>{brl(total)}</b></span>
              {aberta && <span className="tl">Pedido <b>{brl(cartTotal)}</b></span>}
            </div>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
              <span style={{ fontSize: 10, letterSpacing: 3, fontWeight: 700, color: "#9aa3ab" }}>TOTAL</span>
              <span style={{ fontSize: 26, fontWeight: 800, color: "#ff9a2e", lineHeight: 1.1, whiteSpace: "nowrap" }}>{brl(total + (aberta ? cartTotal : 0))}</span>
            </div>
          </div>
          {aberta ? (
            <div style={{ display: "flex", gap: 10 }}>
              {podeReceber && itens.length > 0 && ativos.length > 0 && <button className="bp contorno" onClick={() => setPagar(true)}>Receber</button>}
              {ativos.length > 0 && <button className="bp verde" onClick={enviar} disabled={busy}>{busy ? "Enviando…" : "Enviar pedido"}</button>}
              {podeReceber && itens.length > 0 && !ativos.length && <button className="bp laranja" onClick={() => setPagar(true)}>Receber e fechar</button>}
              {!podeReceber && itens.length > 0 && !ativos.length && <button className="bp nada" disabled>Fechamento da conta é no caixa</button>}
              {!itens.length && !ativos.length && <button className="bp nada" disabled>Adicione itens para enviar</button>}
            </div>
          ) : <button className="bp contorno" style={{ flex: 1 }} onClick={voltar}>Voltar às mesas</button>}
        </div>
      </aside>

      {falha && (
        <div className="fundo">
          <div className="modal" style={{ maxWidth: 420 }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: 12, padding: "28px 24px 22px" }}>
              <div style={{ width: 56, height: 56, borderRadius: 28, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(240,82,82,.12)", border: "1px solid rgba(240,82,82,.35)" }}>
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f05252" strokeWidth="2" strokeLinecap="round"><path d="M2 8.8a15 15 0 0 1 20 0" /><path d="M5 12.5a10 10 0 0 1 14 0" /><path d="M8.5 16a5 5 0 0 1 7 0" /><path d="M12 20h.01" /><path d="M3 3l18 18" /></svg>
              </div>
              <span className="sora" style={{ fontWeight: 700, fontSize: 19, color: "#f4f4f4" }}>A conexão com o servidor falhou</span>
              <span style={{ fontSize: 14, lineHeight: 1.5, color: "#9aa3ab" }}>
                O pedido {rot.titulo.startsWith("Comanda") ? "da " : "do "}{rot.titulo} não foi confirmado. Os {cart.length} {cart.length === 1 ? "item continua salvo" : "itens continuam salvos"} aqui,
                nada se perde. Confira a rede e tente de novo.
              </span>
            </div>
            <div className="rodape" style={{ justifyContent: "space-between", padding: "0 22px 22px" }}>
              <button className="bt cont" onClick={() => setFalha(false)} disabled={busy}>Agora não</button>
              <button className="bt verde" onClick={enviar} disabled={busy}>{busy ? "Reconectando…" : "Tentar reconectar"}</button>
            </div>
          </div>
        </div>
      )}

      {menu && (
        <div className="menuctx" style={{ left: menu.x, top: menu.y }} onClick={(e) => e.stopPropagation()}>
          <button onClick={() => { const a = menu.acao; setMenu(null); a(); }}>✕ {menu.rotulo}</button>
        </div>
      )}

      {autorizar && (
        <Autorizar token={token} loja={loja} titulo={autorizar.titulo} texto={autorizar.texto} onde={rot.titulo} fechar={() => setAutorizar(null)}
          ok={(por) => { const f = autorizar.ok; setAutorizar(null); f(por); }} />
      )}

      {cancelando && idAt && (
        <CancelarItem token={token} loja={loja} idAt={idAt} item={cancelando} onde={rot.titulo} fechar={() => setCancelando(null)}
          fim={async (msg) => { setCancelando(null); avisar(msg); await carregar(); }} />
      )}

      {pagar && idAt && (
        <Receber token={token} loja={loja} idAt={idAt} mesa={{ ...mesa, tipo, nome: mesa.nome || (com && com.nome), numeroAtendimento: com && com.numeroAtendimento }} total={total} fechar={() => setPagar(false)}
          fim={async (r, msg) => {
            setPagar(false);
            if (r.finalizado) {
              pendente.current = null; store.set(chaveCart, null);
              avisar(rot.titulo + " fechada · " + brl(total) + (nnum(r.troco) > 0 ? " · troco " + brl(nnum(r.troco)) : ""));
              voltar();
            }
            else { avisar(msg || "Pagamento registrado.", !!r.motivo); await carregar(); }
          }} />
      )}
    </main>
  );
}

function ClienteBox({ cli, aberto, podeMexer, token, loja, toggle, escolher }) {
