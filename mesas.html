  const deb = useRef(null);
  useEffect(() => {
    clearTimeout(deb.current);
    if (!aberto || q.trim().length < 2) { setLista(null); return; }
    deb.current = setTimeout(async () => {
      try { setLista((await api("/salao/garcom/clientes?q=" + encodeURIComponent(q.trim()), { token, loja })).data || []); } catch (e) { setLista([]); }
    }, 300);
  }, [q, aberto]);
  const tem = !!cli.id;
  return (
    <div className="clibox">
      <button className="cli" onClick={() => podeMexer && toggle()} style={{ cursor: podeMexer ? "pointer" : "default" }}
        title={tem ? (cli.tabela ? "Tabela " + cli.tabela : cli.nome) : "Escolher o cliente aplica a tabela de preço dele"}>
        <span className="av" style={{ background: tem ? "#2a1f4a" : "#0f2e33", color: tem ? "#b79bff" : "#3ec6d6" }}>{tem ? iniciais(cli.nome) : "?"}</span>
        <span style={{ flex: 1, minWidth: 0, fontWeight: 700, fontSize: 13, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{tem ? cli.nome : "Sem cliente"}</span>
        {podeMexer && <span style={{ color: "#5ab0f0", fontSize: 12, fontWeight: 700, flex: "none" }}>{aberto ? "Fechar" : tem ? "Trocar" : "Escolher"}</span>}
      </button>
      {aberto && (
        <div className="clidrop">
          <input className="inp" style={{ height: 36, marginBottom: 4 }} autoFocus placeholder="Nome, apelido ou CPF/CNPJ" value={q} onChange={(e) => setQ(e.target.value)} />
          {lista && !lista.length && <div style={{ padding: "8px 10px", fontSize: 13, color: "#9aa3ab" }}>Nenhum cliente encontrado.</div>}
          {(lista || []).map((c) => (
            <button key={c.id} className="cliop" onClick={() => escolher(c)}>
              <span>{c.nome}{c.documento ? <span style={{ color: "#7d8a96", fontWeight: 500 }}> · {c.documento}</span> : null}</span>
              <span style={{ fontSize: 12, fontWeight: 500, color: "#7d8a96", whiteSpace: "nowrap" }}>{c.tabela ? "Tabela " + c.tabela : "sem tabela"}</span>
            </button>
          ))}
          {tem && <button className="cliop" onClick={() => escolher(null)}><span>Remover cliente</span><span style={{ fontSize: 12, fontWeight: 500, color: "#7d8a96" }}>volta ao preço normal</span></button>}
        </div>
      )}
    </div>
  );
}

function Produtos({ token, loja, idCliente, cart, onAdd, voltar }) {
  const [q, setQ] = useState(""), [grupos, setGrupos] = useState([]), [grupo, setGrupo] = useState(null);
  const [lista, setLista] = useState(null);
  const deb = useRef(null);
  useEffect(() => { api("/salao/garcom/grupos", { token, loja }).then(({ data }) => setGrupos(data || [])).catch(() => {}); }, [token, loja]);
  useEffect(() => {
    clearTimeout(deb.current);
    const t = q.trim();
    if (t.length === 1 && !/^\d$/.test(t)) return;
    deb.current = setTimeout(async () => {
      try {
        const { data } = await api("/salao/garcom/produtos?q=" + encodeURIComponent(t) + (idCliente ? "&idCliente=" + idCliente : "") + (grupo ? "&grupo=" + grupo : ""), { token, loja });
        setLista(data || []);
      } catch (e) { setLista([]); }
    }, t ? 300 : 0);
  }, [q, grupo, idCliente, token, loja]);
  const aba = (id, label) => <button key={label} className={grupo === id ? "on" : ""} onClick={() => setGrupo(id)}>{label}</button>;
  return (
    <section className="prods">
      <div className="topo-p">
        <button className="voltar" onClick={voltar}>← Voltar</button>
        <div className="busca"><span>⌕</span><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar por nome, código ou código de barras" /></div>
      </div>
      <div className="chips">
        {aba(null, "Todos")}{grupos.map((g) => aba(g.id, g.nome))}
        <span style={{ marginLeft: "auto", fontSize: 13, color: "#7d8a96" }}>{lista ? lista.length + " produtos" : ""}</span>
      </div>
      <div className="plista">
        {lista == null ? <div className="carreg">Carregando…</div> : !lista.length ? (
          <div style={{ padding: "60px 20px", textAlign: "center", display: "flex", flexDirection: "column", gap: 6 }}>
            <span className="sora" style={{ fontWeight: 600, fontSize: 16, color: "#e4e4e4" }}>Nenhum produto encontrado</span>
            <span style={{ fontSize: 13, color: "#7d8a96" }}>Tente outro nome ou código.</span>
          </div>
        ) : (
          <div className="pgrade">
            {lista.map((p) => {
              const noCart = cart.filter((c) => c.id === p.id).reduce((s, c) => s + c.qtd, 0);
              const desc = nnum(p.precoNormal) > 0 && Math.abs(nnum(p.precoNormal) - nnum(p.preco)) >= 0.005;
              return (
                <button key={p.id} className={"pcard" + (noCart ? " on" : "")} onClick={() => onAdd(p)} title={p.descricao}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, minHeight: 20 }}>
                    <span className="gr">{p.grupo || p.codigo || ""}</span>
                    {noCart > 0 && <span className="badge" style={{ marginLeft: "auto" }}>{noCart}</span>}
                  </div>
                  <span className="nome">{p.descricao}</span>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                    <span className={"preco" + (desc ? " desc" : "")}>{desc && <s>{brl(nnum(p.precoNormal))}</s>}{brl(nnum(p.preco))}</span>
                    <span className="mais">+</span>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ reposição pra cozinha */
// Vitrine acabou (coxinha, pastel…): pede pra cozinha repor. Sai um cupom REPOSIÇÃO na impressora da
// cozinha; não é venda e não mexe no estoque. Só aparecem os produtos marcados como reposição.
function Reposicao({ token, loja, avisar, voltar }) {
  const [dados, setDados] = useState(null);
  const [cart, setCart] = useState([]);
  const [obs, setObs] = useState("");
  const [grupo, setGrupo] = useState(null);
  const [editar, setEditar] = useState(false);
  const [busy, setBusy] = useState(false);
  const carregar = useCallback(async () => {
    try { setDados((await api("/salao/garcom/reposicao", { token, loja })).data || { ids: [], produtos: [] }); }
    catch (e) { avisar(e.status === 404 ? "Atualize o agente da loja pra usar a reposição." : e.message, true); setDados({ ids: [], produtos: [] }); }
  }, [token, loja]);
  useEffect(() => { carregar(); }, [carregar]);

  const produtos = (dados && dados.produtos) || [];
  const grupos = [...new Set(produtos.map((p) => p.grupo).filter(Boolean))];
  const vis = produtos.filter((p) => !grupo || p.grupo === grupo);
  const qtdCart = cart.reduce((s, c) => s + c.qtd, 0);
  function add(p) {
    setCart((cs) => {
      const i = cs.findIndex((c) => c.id === p.id);
      if (i >= 0) { const n = [...cs]; n[i] = { ...n[i], qtd: n[i].qtd + 1 }; return n; }
      return [...cs, { id: p.id, nome: p.descricao, qtd: 1, obs: "" }];
    });
  }
  async function enviar() {
    if (!cart.length || busy) return;
    setBusy(true);
    try {
      const { message } = await api("/salao/garcom/reposicao/pedir", { method: "POST", token, loja, timeout: 10000,
        body: { obs: obs.trim() || undefined, itens: cart.filter((c) => c.qtd > 0).map((c) => ({ idProduto: c.id, qtd: c.qtd, ...(c.obs.trim() ? { obs: c.obs.trim() } : {}) })) } });
      avisar(message || "Reposição enviada pra cozinha.");
      setCart([]); setObs("");
    } catch (e) { avisar(e.message, true); }
    setBusy(false);
  }

  if (editar) return <EditarReposicao token={token} loja={loja} avisar={avisar} ids={(dados && dados.ids) || []} fechar={() => { setEditar(false); carregar(); }} />;
  return (
    <main className="main-mesa">
      <section className="prods">
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <h1 className="h1">Reposição pra cozinha</h1>
            <span className="resumo">Acabou na vitrine? Toque nos produtos e envie: sai na impressora da cozinha.</span>
          </div>
          <button className="hbtn" onClick={() => setEditar(true)}>Editar lista</button>
        </div>
        {grupos.length > 1 && <div className="abas"><button className={!grupo ? "on" : ""} onClick={() => setGrupo(null)}>Todos</button>{grupos.map((g) => <button key={g} className={grupo === g ? "on" : ""} onClick={() => setGrupo(g)}>{g}</button>)}</div>}
        <div className="plista">
          {dados == null ? <div className="carreg">Carregando…</div> : !produtos.length ? (
            <div style={{ padding: "60px 20px", textAlign: "center", display: "flex", flexDirection: "column", gap: 10, alignItems: "center" }}>
              <span className="sora" style={{ fontWeight: 600, fontSize: 16, color: "#e4e4e4" }}>Nenhum produto marcado pra reposição</span>
              <span style={{ fontSize: 13, color: "#7d8a96" }}>Marque os produtos da vitrine (coxinha, pastel…) em Editar lista.</span>
              <button className="bt verde" style={{ marginTop: 8 }} onClick={() => setEditar(true)}>Escolher produtos</button>
            </div>
          ) : (
            <div className="pgrade">
              {vis.map((p) => {
                const n = cart.filter((c) => c.id === p.id).reduce((s, c) => s + c.qtd, 0);
                return (
                  <button key={p.id} className={"pcard" + (n ? " on" : "")} onClick={() => add(p)}>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, minHeight: 24 }}>
                        <span className="gr">{p.grupo || ""}</span>
                        {n > 0 && <span className="badge">{n}</span>}
                      </div>
                      <span className="nome">{p.descricao}</span>
                    </div>
                    <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 8 }}>
                      <span style={{ fontSize: 12, color: p.temPonto ? "#7d8a96" : "#f05252" }}>{p.temPonto ? "toque pra pedir" : "sem impressora no LinkPro"}</span>
                      <span className="mais">+</span>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </section>

      <aside className="aside">
        <div className="topo" style={{ flexDirection: "column", alignItems: "stretch", gap: 14 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
            <span className="rot2" style={{ color: "#6b747d" }}>PEDIDO PRA COZINHA</span>
            <h1 className="sora" style={{ margin: 0, fontWeight: 600, fontSize: 30, lineHeight: 1.1, letterSpacing: "-.03em", color: "#f5a524" }}>Reposição</h1>
          </div>
          <input className="inp" style={{ height: 42 }} value={obs} onChange={(e) => setObs(e.target.value)} maxLength={120} placeholder="Recado geral (ex.: urgente, pra antes das 18h)" />
        </div>
        <div className="rolo">
          <div className="sech"><div className="esq"><span className="pt" style={{ background: "#f5a524" }} /><span className="rot2">ITENS</span><span className="s">{qtdCart ? qtdCart + (qtdCart > 1 ? " unidades" : " unidade") : ""}</span></div>
            {cart.length > 0 && <button className="limpar" onClick={() => setCart([])}>Limpar</button>}</div>
          {!cart.length ? (
            <div className="vazio">
              <span style={{ fontSize: 14, fontWeight: 500, color: "#d6d6d6" }}>Nada pra repor ainda</span>
              <span style={{ fontSize: 12, color: "#7d8a96" }}>Toque nos produtos que acabaram.</span>
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", padding: "0 16px" }}>
              {cart.map((c, idx) => (
                <div className="cartl" key={c.id}>
                  <span className="nm">{c.nome}</span>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div className="stepper">
                      <button onClick={() => setCart((cs) => cs.flatMap((x, j) => (j !== idx ? [x] : x.qtd > 1 ? [{ ...x, qtd: x.qtd - 1 }] : [])))}>−</button>
                      {/* digita a quantidade (ex.: 30) ou usa o − e + */}
                      <input inputMode="numeric" value={c.qtd || ""} onFocus={(e) => e.target.select()}
                        onChange={(e) => { const v = Math.min(9999, parseInt(e.target.value.replace(/\D/g, ""), 10) || 0); setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, qtd: v } : x))); }}
                        onBlur={() => setCart((cs) => cs.map((x, j) => (j === idx && !(x.qtd > 0) ? { ...x, qtd: 1 } : x)))} />
                      <button onClick={() => setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, qtd: x.qtd + 1 } : x)))}>+</button>
                    </div>
                    <input className="obsin" value={c.obs} placeholder="Observação" maxLength={120}
                      onChange={(e) => { const v = e.target.value; setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, obs: v } : x))); }} />
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="pe">
          <span style={{ fontSize: 12, color: "#7d8a96" }}>Não é venda e não mexe no estoque: só avisa a cozinha.</span>
          <div style={{ display: "flex", gap: 10 }}>
            {cart.length > 0
              ? <button className="bp laranja" onClick={enviar} disabled={busy}>{busy ? "Enviando…" : "Enviar pra cozinha"}</button>
              : <button className="bp nada" disabled>Escolha o que repor</button>}
          </div>
        </div>
      </aside>
    </main>
  );
}

/* marca/desmarca os produtos da reposição (busca em todos os produtos) */
function EditarReposicao({ token, loja, avisar, ids, fechar }) {
  const [marc, setMarc] = useState(new Set(ids));
  const [q, setQ] = useState(""), [lista, setLista] = useState(null);
  const deb = useRef(null);
  useEffect(() => {
    clearTimeout(deb.current);
    deb.current = setTimeout(async () => {
      try { setLista((await api("/salao/garcom/produtos?q=" + encodeURIComponent(q.trim()), { token, loja })).data || []); }
      catch (e) { setLista([]); }
    }, q.trim() ? 300 : 0);
  }, [q]);
  async function alternar(p) {
    const vai = !marc.has(p.id);
    try {
      await api("/salao/garcom/reposicao/marcar", { method: "POST", token, loja, body: { idProduto: p.id, marcado: vai } });
      setMarc((m) => { const n = new Set(m); vai ? n.add(p.id) : n.delete(p.id); return n; });
    } catch (e) { avisar(e.message, true); }
  }
  return (
    <main className="main-mesas">
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <h1 className="h1">Produtos da reposição</h1>
          <span className="resumo">{marc.size} marcado(s). Marque o que fica na vitrine e a cozinha repõe.</span>
        </div>
        <button className="bt verde" onClick={fechar}>Pronto</button>
      </div>
      <div className="busca"><span>⌕</span><input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar produto por nome ou código" /></div>
      {lista == null ? <div className="carreg">Carregando…</div> : (
        <div className="pgrade">
          {lista.map((p) => {
            const on = marc.has(p.id);
            return (
              <button key={p.id} className={"pcard" + (on ? " on" : "")} onClick={() => alternar(p)} style={{ minHeight: 110 }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, minWidth: 0 }}>
                  <span className="gr">{p.grupo || p.codigo || ""}</span>
                  <span className="nome">{p.descricao}</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: on ? "#2fd36b" : "#7d8a96" }}>{on ? "Na reposição" : "Marcar"}</span>
                  <span className="mais">{on ? "✓" : "+"}</span>
                </div>
              </button>
            );
          })}
        </div>
      )}
    </main>
  );
}

/* Pedir o cancelamento pelo celular de quem pode aprovar (sem senha na hora). O relay manda o push; ao aprovar,
   item já lançado é cancelado pelo agente no nome de quem aprovou; pedido novo só fica liberado. */
function PedirCelular({ token, loja, descricao, acao, aprovado }) {
  const [sol, setSol] = useState(null), [erro, setErro] = useState(""), [busy, setBusy] = useState(false);
  const [agora, setAgora] = useState(Date.now());
  useEffect(() => {
    if (!sol || sol.status !== "PENDENTE") return;
    const t = setInterval(async () => {
      setAgora(Date.now());
      try {
        const { data } = await api("/cancelamentos/" + sol.id, { token, loja });
        setSol((x) => ({ ...x, ...data }));
        if (data.status === "APROVADO") aprovado(data.aprovador || "", data.resultado || "");
      } catch (e) {}
    }, 2500);
    return () => clearInterval(t);
  }, [sol && sol.id, sol && sol.status]);
  async function pedir() {
    setBusy(true); setErro("");
    try { setSol((await api("/cancelamentos", { method: "POST", token, loja, body: { descricao, acao } })).data); }
    catch (e) { setErro(e.rede ? "Sem internet: peça a senha de quem autoriza." : e.message); }
    setBusy(false);
  }
  if (!sol) return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      <button className="bt cont" onClick={pedir} disabled={busy} style={{ width: "100%", borderColor: "#2a4a7a", color: "#8cc6f5" }}>
        {busy ? "Enviando…" : "📱 Pedir autorização pelo celular"}
      </button>
      {erro && <span style={{ fontSize: 12, fontWeight: 600, color: "#f05252" }}>{erro}</span>}
    </div>
  );
  const resta = Math.max(0, Math.round((new Date(sol.venceEm).getTime() - agora) / 1000));
  const cor = sol.status === "PENDENTE" ? "#8cc6f5" : sol.status === "APROVADO" ? "#2fd36b" : "#f05252";
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4, padding: 12, borderRadius: 12, background: "#181818", border: "1px solid " + cor }}>
      {sol.status === "PENDENTE" ? (<>
        <span style={{ fontSize: 13, fontWeight: 700, color: cor }}>Aguardando aprovação pelo celular…</span>
        <span style={{ fontSize: 12, color: "#9aa3ab" }}>{(sol.aprovadores || []).length ? "Enviado pra " + sol.aprovadores.join(", ") + ". " : ""}Vence em {Math.floor(resta / 60)}:{pad(resta % 60)}.</span>
      </>) : (
        <span style={{ fontSize: 13, fontWeight: 700, color: cor }}>
          {sol.status === "APROVADO" ? "Aprovado por " + (sol.aprovador || "") : sol.status === "RECUSADO" ? "Recusado por " + (sol.aprovador || "")
            : sol.status === "EXPIRADO" ? "O pedido venceu sem resposta." : sol.resultado || "Não deu certo."}
        </span>
      )}
      {sol.status !== "PENDENTE" && sol.status !== "APROVADO" && <button className="limpar" style={{ alignSelf: "flex-start" }} onClick={() => setSol(null)}>Pedir de novo</button>}
    </div>
  );
}

/* autorização pra tirar item do pedido novo / limpar: se o usuário do LinkPro do garçom já pode, passa direto;
   senão pede usuário e senha de quem pode (Administrador ou "permitir cancelamentos") */
function Autorizar({ token, loja, titulo, texto, onde, fechar, ok }) {
  const [pede, setPede] = useState(false);
  const [login, setLogin] = useState(""), [senha, setSenha] = useState("");
  const [busy, setBusy] = useState(true), [erro, setErro] = useState("");
  async function conferir(comSenha) {
    setBusy(true); setErro("");
    try {
      const { data } = await api("/salao/garcom/autorizar", { method: "POST", token, loja, body: comSenha ? { login: login.trim(), senha } : {} });
      ok((data && data.autorizadoPor) || "");
      return;
    } catch (e) {
      if (e.status === 403) setPede(true);
      else { setPede(true); if (comSenha) { setErro(e.message); setSenha(""); } else setErro(e.status === 404 ? "Atualize o agente da loja." : ""); }
    }
    setBusy(false);
  }
  useEffect(() => { conferir(false); }, []);
  return (
    <div className="fundo" onClick={() => !busy && fechar()}>
      <div className="modal" style={{ maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, padding: "20px 22px 12px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 19, color: "#f4f4f4" }}>{titulo}</span>
            <button className="x" onClick={fechar} disabled={busy && !pede}>×</button>
          </div>
          <span style={{ fontSize: 14, color: "#d6d6d6" }}>{texto}</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: "6px 22px 14px" }}>
          {!pede ? <span style={{ fontSize: 13, color: "#9aa3ab" }}>Conferindo permissão…</span> : (<>
            <span style={{ fontSize: 13, fontWeight: 700, color: "#f5a524" }}>Autorização: usuário do LinkPro com permissão de cancelar</span>
            <input className="inp" style={{ height: 40 }} autoFocus placeholder="Usuário (ex.: admin)" value={login} onChange={(e) => setLogin(e.target.value)} autoComplete="off" />
            <input className="inp" style={{ height: 40 }} type="password" placeholder="Senha" value={senha} onChange={(e) => setSenha(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && login.trim() && senha && conferir(true)} autoComplete="new-password" />
            <span style={{ fontSize: 12, color: "#6b747d", textAlign: "center" }}>ou</span>
            <PedirCelular token={token} loja={loja} descricao={titulo + ": " + texto + (onde ? " · " + onde : "")} acao={{ tipo: "pedido-novo" }}
              aprovado={(por) => ok(por)} />
          </>)}
          {erro && <span style={{ fontSize: 13, fontWeight: 600, color: "#f05252" }}>{erro}</span>}
        </div>
        <div className="rodape" style={{ justifyContent: "space-between", padding: "4px 22px 20px" }}>
          <button className="bt cont" onClick={fechar}>Voltar</button>
          <button className="bt" disabled={busy || !pede || !login.trim() || !senha} onClick={() => conferir(true)} style={{ background: "#f05252", color: "#fff" }}>
            {busy && pede ? "Conferindo…" : "Autorizar"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* cancelar/diminuir item já lançado: precisa de um usuário do LinkPro Administrador ou com
   "permitir cancelamentos" (se o próprio garçom não tiver, pede usuário e senha de quem tem) */
function CancelarItem({ token, loja, idAt, item, onde, fechar, fim }) {
  const max = nnum(item.qtd);
  const [tirar, setTirar] = useState(max);
  const [pedeSenha, setPedeSenha] = useState(false);
  const [login, setLogin] = useState(""), [senha, setSenha] = useState("");
  const [busy, setBusy] = useState(false), [erro, setErro] = useState("");
  const inteiro = Number.isInteger(max);
  async function confirmar() {
    if (busy) return;
    if (pedeSenha && (!login.trim() || !senha)) { setErro("Informe usuário e senha de quem autoriza."); return; }
    setBusy(true); setErro("");
    try {
      const { data } = await api("/salao/garcom/atendimento/" + idAt + "/item/" + item.id + "/cancelar", { method: "POST", token, loja,
        body: { qtd: tirar, ...(pedeSenha ? { login: login.trim(), senha } : {}) } });
      const fica = nnum(data && data.fica);
      fim(fica > 0 ? "Diminuído: " + qtdTxt(fica) + "× " + item.descricao : "Cancelado: " + item.descricao);
    } catch (e) {
      if (e.status === 403 && !pedeSenha) { setPedeSenha(true); setErro(""); }
      else { setErro(e.message); setSenha(""); }
    }
    setBusy(false);
  }
  const tudo = tirar >= max;
  return (
    <div className="fundo" onClick={() => !busy && fechar()}>
      <div className="modal" style={{ maxWidth: 440 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, padding: "20px 22px 14px", borderBottom: "1px solid #232323" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 19, color: "#f4f4f4" }}>{tudo ? "Cancelar item" : "Diminuir item"}</span>
            <button className="x" onClick={fechar} disabled={busy}>×</button>
          </div>
          <span style={{ fontSize: 14, color: "#d6d6d6" }}>{qtdTxt(max)}× {item.descricao}</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14, padding: "16px 22px" }}>
          {max > 1 && inteiro && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
              <span style={{ fontSize: 14, color: "#9aa3ab" }}>Quantos tirar?</span>
              <div className="stepper">
                <button onClick={() => setTirar((t) => Math.max(1, t - 1))}>−</button>
                <span>{tirar}</span>
                <button onClick={() => setTirar((t) => Math.min(max, t + 1))}>+</button>
              </div>
            </div>
          )}
          <span style={{ fontSize: 13, color: "#9aa3ab" }}>{tudo ? "O item sai da conta e o estoque volta." : "Fica " + qtdTxt(max - tirar) + "× na conta; o estoque do que saiu volta."}</span>
          {pedeSenha && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: 12, borderRadius: 12, background: "#181818", border: "1px solid #4a3a1a" }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: "#f5a524" }}>Autorização: usuário do LinkPro com permissão de cancelar</span>
              <input className="inp" style={{ height: 40 }} autoFocus placeholder="Usuário (ex.: admin)" value={login} onChange={(e) => setLogin(e.target.value)} autoComplete="off" />
              <input className="inp" style={{ height: 40 }} type="password" placeholder="Senha" value={senha} onChange={(e) => setSenha(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && confirmar()} autoComplete="new-password" />
              <span style={{ fontSize: 12, color: "#6b747d", textAlign: "center" }}>ou</span>
              <PedirCelular token={token} loja={loja}
                descricao={(tudo ? "Cancelar " + qtdTxt(max) : "Tirar " + qtdTxt(tirar) + " de " + qtdTxt(max)) + "× " + item.descricao + " (" + brl(nnum(item.preco) * tirar) + ")" + (onde ? " · " + onde : "")}
                acao={{ tipo: "item", idAtendimento: idAt, idItem: item.id, qtd: tirar }}
                aprovado={(por) => fim((tudo ? "Cancelado" : "Diminuído") + " com aprovação de " + por + ": " + item.descricao)} />
            </div>
          )}
          {erro && <span style={{ fontSize: 13, fontWeight: 600, color: "#f05252" }}>{erro}</span>}
        </div>
        <div className="rodape" style={{ justifyContent: "space-between", padding: "4px 22px 20px" }}>
          <button className="bt cont" onClick={fechar} disabled={busy}>Voltar</button>
          <button className="bt" onClick={confirmar} disabled={busy} style={{ background: "#f05252", color: "#fff" }}>
            {busy ? "Conferindo…" : pedeSenha ? "Autorizar e " + (tudo ? "cancelar" : "diminuir") : tudo ? "Cancelar item" : "Diminuir " + tirar}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ receber */
const METODOS = [["dinheiro", "Dinheiro"], ["pix", "Pix"], ["debito", "Débito"], ["credito", "Crédito"]];
function Receber({ token, loja, idAt, mesa, total, fechar, fim }) {
  const [metodo, setMetodo] = useState("dinheiro");
  const [entrada, setEntrada] = useState("");
  const [pags, setPags] = useState([]);
  const [busy, setBusy] = useState(false), [erro, setErro] = useState("");
  const pago = pags.reduce((s, p) => s + p.valor, 0);
  const dinheiro = pags.filter((p) => p.forma === "dinheiro").reduce((s, p) => s + p.valor, 0);
  const resto = Math.round((total - pago) * 100) / 100;
  const troco = Math.max(0, -resto);
  const trocoInvalido = troco > dinheiro + 0.004;
  const pode = pags.length > 0 && resto <= 0.005 && !trocoInvalido;
  const nomeMetodo = (k) => (METODOS.find((m) => m[0] === k) || [k, k])[1];

  function adicionar(v) {
    const valor = v != null ? v : (entrada ? num(entrada) : Math.max(resto, 0));
    if (!(valor > 0)) return;
    setPags((ps) => [...ps, { forma: metodo, valor: Math.round(valor * 100) / 100 }]);
    setEntrada(""); setErro("");
  }
  async function confirmar() {
    if (!pode || busy) return;
    setBusy(true); setErro("");
    try {
      const { data, message } = await api("/salao/garcom/atendimento/" + idAt + "/receber", { method: "POST", token, loja,
        body: { pagamentos: pags.map((p) => ({ forma: p.forma, valor: p.valor })), finalizar: true } });
      fim(data || {}, message);
    } catch (e) { setErro(e.message); }
    setBusy(false);
  }
  const corResto = resto > 0.005 ? "#f05252" : resto < -0.005 ? (trocoInvalido ? "#f05252" : "#f5a524") : "#2fd36b";
  const rotResto = resto > 0.005 ? "Falta" : resto < -0.005 ? (trocoInvalido ? "Troco maior que o dinheiro" : "Troco") : "Quitado";
  return (
    <div className="fundo" onClick={() => !busy && fechar()}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", flexDirection: "column", gap: 4, padding: "20px 22px 18px", borderBottom: "1px solid #232323" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 20, color: "#f4f4f4" }}>Receber · {rotulo(mesa).titulo}</span>
            <button className="x" onClick={fechar} disabled={busy}>×</button>
          </div>
          <span style={{ fontSize: 13, color: "#9aa3ab" }}>Total da mesa</span>
          <span className="sora" style={{ fontWeight: 700, fontSize: 36, letterSpacing: "-.02em", color: "#f4f4f4" }}>{brl(total)}</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14, padding: "18px 22px" }}>
          <div className="metodos">
            {METODOS.map(([k, l]) => <button key={k} onClick={() => setMetodo(k)} style={{ background: metodo === k ? "#3b9be8" : "transparent", color: metodo === k ? "#fff" : "#9aa3ab" }}>{l}</button>)}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1, position: "relative" }}>
              <span className="sora" style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontWeight: 600, fontSize: 14, color: "#7d8a96" }}>R$</span>
              <input value={entrada} onChange={(e) => setEntrada(e.target.value)} onKeyDown={(e) => e.key === "Enter" && adicionar()} inputMode="decimal"
                placeholder={metodo === "dinheiro" ? "valor entregue" : "valor em " + nomeMetodo(metodo).toLowerCase()}
                style={{ width: "100%", height: 48, padding: "0 14px 0 44px", borderRadius: 12, border: "1px solid #2a4a7a", background: "#181818", color: "#f4f4f4", font: "600 16px Sora", outline: "none" }} />
            </div>
            <button onClick={() => adicionar()} style={{ height: 48, padding: "0 18px", borderRadius: 12, border: "1px solid #2a4a7a", background: "#13233f", color: "#8cc6f5", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Adicionar</button>
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {[["Valor restante", Math.max(resto, 0)], ["R$ 20", 20], ["R$ 50", 50], ["R$ 100", 100]].map(([l, v]) => (
              <button key={l} className="rapido" onClick={() => adicionar(v)}>{l}</button>
            ))}
          </div>
          {pags.map((p, i) => (
            <div className="pl" key={i}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#2fd36b" }} />
              <span style={{ flex: 1, fontSize: 14, fontWeight: 600, color: "#e4e4e4" }}>{nomeMetodo(p.forma)}</span>
              <span className="sora" style={{ fontWeight: 600, fontSize: 14 }}>{brl(p.valor)}</span>
              <button onClick={() => setPags((ps) => ps.filter((_, j) => j !== i))} style={{ width: 26, height: 26, border: 0, borderRadius: 7, background: "transparent", color: "#7d8a96", cursor: "pointer", fontSize: 14 }}>×</button>
            </div>
          ))}
          {erro && <span style={{ fontSize: 13, fontWeight: 600, color: "#f05252" }}>{erro}</span>}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, padding: "14px 22px", borderTop: "1px solid #232323", background: "#151515" }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, color: "#9aa3ab" }}><span>Recebido</span><span className="sora" style={{ fontWeight: 600, color: "#ececec" }}>{brl(pago)}</span></div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: corResto }}>{rotResto}</span>
            <span className="sora" style={{ fontWeight: 700, fontSize: 22, color: corResto }}>{brl(Math.abs(resto))}</span>
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, padding: "16px 22px 20px" }}>
          <button className="bt cont" onClick={fechar} disabled={busy} style={{ height: 48, fontSize: 15, fontWeight: 700, color: "#d6d6d6" }}>Cancelar</button>
          <button className="bt" onClick={confirmar} disabled={!pode || busy}
            style={{ height: 48, padding: "0 24px", background: pode ? "#2fd36b" : "#173a2b", color: pode ? "#04210f" : "#4f7d63", opacity: 1 }}>
            {busy ? "Fechando…" : "Receber e fechar"}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
