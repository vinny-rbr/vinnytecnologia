<style>

  .fundo-app { min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(1200px 500px at 50% -200px, #13203d 0%, #0a1020 70%); }

  /* mesas */
  .main-mesas { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px; }

  .main-mesa { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); gap: 20px; height: calc(100vh - 64px); }

  .box { border-radius: 16px; border: 1px solid #1c2846; background: #101a30; display: flex; flex-direction: column; }

  .boxh .t { font-weight: 700; font-size: 15px; color: #f2f6fc; }

  .vazio { margin: 0 16px 16px; padding: 22px; border-radius: 12px; border: 1px dashed #22304f; text-align: center; font-size: 14px; color: #7f9cc9; }
  .cli { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; border-radius: 16px; }

  .cliop { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; color: #dbe5f3; font-weight: 600; font-size: 13px; cursor: pointer; text-align: left; }

  .lin { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 6px 0; }
  .q { font: 700 13px Sora; color: #3b9be8; }
  .nm { font-size: 14px; font-weight: 600; color: #dbe5f3; }

  .val.desc { color: #22c55e; }
  .rodape { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px 16px; border-top: 1px solid #172340; }
  .bt { height: 46px; padding: 0 22px; border: 0; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
  .bt:disabled { opacity: .55; cursor: not-allowed; }
  .bt.laranja { background: #f5a524; color: #1a1204; box-shadow: 0 6px 20px -8px rgba(245,165,36,.6); }
  .bt.laranja:hover { background: #ffb53d; }
  .bt.verde { background: #22c55e; color: #04210f; box-shadow: 0 6px 20px -8px rgba(34,197,94,.6); }
  .bt.verde:hover:not(:disabled) { background: #34d46d; }
  .bt.cont { background: transparent; border: 1px solid #22304f; color: #a9badb; font-weight: 600; font-size: 14px; padding: 0 16px; }

  .cartl { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: start; padding: 12px 16px; border-top: 1px solid #172340; }
  .stepper { display: flex; align-items: center; height: 36px; border-radius: 10px; border: 1px solid #22304f; background: #0c1426; }
  .stepper button { width: 34px; height: 34px; border: 0; background: transparent; color: #c9d6ea; font: 700 16px Sora; cursor: pointer; border-radius: 10px; }
  .stepper button:hover { color: #fff; background: #16223d; }
  .stepper span { min-width: 22px; text-align: center; font: 700 14px Sora; }
  .inp { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid #1f2b48; background: #0c1426; color: #e6edf7; font: 500 13px Manrope; outline: none; width: 100%; }
  .inp:focus { border-color: #3b9be8; }
  .prodbox { display: flex; flex-direction: column; min-height: 0; border-radius: 18px; border: 1px solid #1c2846; background: #101a30; overflow: hidden; }
  .busca { position: relative; }
  .busca span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #5e7398; font-size: 15px; }
  .busca input { width: 100%; height: 44px; padding: 0 14px 0 38px; border-radius: 12px; border: 1px solid #1f2b48; background: #0c1426; color: #e6edf7; font: 500 14px Manrope; outline: none; }
  .busca input:focus { border-color: #3b9be8; }
  .chip { height: 32px; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: .02em; cursor: pointer; }
  .prod { width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 14px; align-items: center; padding: 12px 10px; border: 0; border-bottom: 1px solid #152038; background: transparent; color: inherit; text-align: left; cursor: pointer; border-radius: 10px; }
  .prod:hover { background: #14203a; }
  .prod .add { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font: 700 13px Sora; }

  /* login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(900px 500px at 50% -120px, #13203d 0%, #0a1020 70%); }
  .login { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px; }
  .lcard { display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 20px; border: 1px solid #1c2846; background: #101a30; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo > span { font-size: 12px; font-weight: 700; color: #a9badb; }
  .campo input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; background: #0c1426; color: #f2f6fc; font: 600 15px Manrope; outline: none; }
  .campo input:focus { border-color: #3b9be8 !important; }

  /* modal receber */
  .fundo { position: fixed; inset: 0; z-index: 50; background: rgba(4,8,18,.72); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { width: 100%; max-width: 480px; max-height: calc(100vh - 48px); overflow: auto; border-radius: 20px; border: 1px solid #22304f; background: #101a30; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); display: flex; flex-direction: column; }
  .metodos { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; padding: 4px; border-radius: 12px; background: #0c1426; border: 1px solid #1a2541; }
  .metodos button { height: 36px; border: 0; border-radius: 9px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .rapido { flex: none; white-space: nowrap; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid #1f2b48; background: transparent; color: #c9d6ea; font-weight: 600; font-size: 12px; cursor: pointer; }
  .rapido:hover { background: #16223d; color: #fff; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #0c1426; border: 1px solid #1a2541; }
  .x { width: 32px; height: 32px; border-radius: 9px; border: 1px solid #1f2b48; background: transparent; color: #a9badb; font-size: 16px; cursor: pointer; }
  .x:hover { background: #16223d; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px; background: #12233a; color: #e6edf7; font-weight: 600; font-size: 14px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.6); max-width: 92vw; }
  .toast .ic { width: 20px; height: 20px; border-radius: 50%; color: #04210f; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: none; }
  .carreg { color: #7f9cc9; padding: 40px; text-align: center; font-size: 14px; }
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
/* Mesas (web): garçom e caixa do restaurante pelo navegador, com o mesmo login do app Meu Giro.
   Abre mesa, cliente com tabela de preço, lança itens e recebe (dinheiro com troco, Pix, débito,
   crédito, várias formas), fechando no caixa do LinkPro. Relay -> agente Link (/api/salao/garcom). */
const { useState, useEffect, useCallback, useRef } = React;
const API = "https://raizestecnologia-relay.onrender.com/api";
const LS_TOKEN = "mg_mesas_token", LS_LOJA = "mg_mesas_loja", LS_DEV = "mg_mesas_device", LS_PASSE = "mg_mesas_passe";
// Modo LOCAL: página servida pelo agente da loja (http://IP-do-PC:8081/mesas). O login passa pelo relay
// só pra pegar o passe assinado; o garçom fala direto com o agente pela rede (funciona sem internet).
const LOCAL = location.pathname.startsWith("/api/local/");
const AGENTE = location.origin + "/api";

const store = {
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, manter = true) {
    try {
      localStorage.removeItem(k); sessionStorage.removeItem(k);
      if (v != null) (manter ? localStorage : sessionStorage).setItem(k, v);
    } catch (e) {}
  },
};
function deviceId() {
  let d = store.get(LS_DEV);
  if (!d) { d = "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set(LS_DEV, d); }
  return d;
}
let aoPerderPasse = () => {};
function uuid() {
  if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
  const h = [...Array(32)].map(() => Math.floor(Math.random() * 16).toString(16));
  h[12] = "4"; h[16] = (8 + Math.floor(Math.random() * 4)).toString(16);
  const t = h.join("");
  return t.slice(0, 8) + "-" + t.slice(8, 12) + "-" + t.slice(12, 16) + "-" + t.slice(16, 20) + "-" + t.slice(20);
}
async function api(path, { method = "GET", body, token, loja, timeout = 15000 } = {}) {
  // no modo local o garçom vai direto pro agente, com o passe; login/passe continuam no relay
  const direto = LOCAL && path.startsWith("/salao/");
  const passe = direto ? store.get(LS_PASSE) : null;
  // sem resposta em `timeout` ms (rede caiu, servidor desligado): falha de conexão, não fica girando
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  let res;
  try {
    res = await fetch((direto ? AGENTE : API) + path, {
      method, signal: ctl.signal,
      headers: { "Content-Type": "application/json",
        ...(direto ? (passe ? { Authorization: "Passe " + passe } : {}) : { ...(token ? { Authorization: "Bearer " + token } : {}), ...(loja ? { "X-Empresa": loja } : {}) }) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    const e = new Error("A conexão com o servidor falhou."); e.rede = true; throw e;
  } finally { clearTimeout(timer); }
  if (direto && res.status === 401) aoPerderPasse();
  let json = {};
  try { json = await res.json(); } catch (e) {}
  if (!res.ok || json.success === false) { const e = new Error(json.message || "Falha na conexão (" + res.status + ")"); e.status = res.status; throw e; }
  return { data: json.data, message: json.message };
}
const num = (v) => { if (typeof v === "number") return v; let t = String(v ?? "").replace(/[^\d.,-]/g, ""); if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); return parseFloat(t) || 0; };
const nnum = (v) => (typeof v === "number" ? v : parseFloat(v) || 0); // vindo da API (ponto decimal)
const brl = (v) => "R$ " + (Math.round(v * 100) / 100).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const ago = (iso) => { const t = new Date(iso).getTime(); if (isNaN(t)) return ""; const m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + " min" : Math.floor(m / 60) + "h" + pad(m % 60); };
const qtdTxt = (q) => (Number.isInteger(nnum(q)) ? String(nnum(q)) : String(nnum(q)).replace(".", ","));
const iniciais = (n) => (n || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();

function Val({ preco, normal, qtd = 1, cls = "val" }) {
  const d = nnum(normal) > 0 && Math.abs(nnum(normal) - nnum(preco)) >= 0.005;
  return <span className={cls + (d ? " desc" : "")}>{d && <s>{brl(nnum(normal) * qtd)}</s>}{brl(nnum(preco) * qtd)}</span>;
}

/* ------------------------------------------------------------------ app */
/* pede o passe local ao relay (precisa de internet) */
async function pegarPasse(token, loja, manter) {
  const { data } = await api("/auth/passe-local", { method: "POST", token, loja });
  store.set(LS_PASSE, data.passe, manter);
  return data.passe;
}

function App() {
  const [token, setToken] = useState(store.get(LS_TOKEN));
  const [lojas, setLojas] = useState(null);
  const [loja, setLoja] = useState(store.get(LS_LOJA));
  const [info, setInfo] = useState(null); // modo local: {loja, nome, pronto}
  const [passe, setPasse] = useState(LOCAL ? store.get(LS_PASSE) : null);
  aoPerderPasse = () => { store.set(LS_PASSE, null); setPasse(null); };
  const [mesa, setMesa] = useState(null);
  const [toast, setToast] = useState(null);
  const tt = useRef(null);
  const avisar = (msg, err = false) => { clearTimeout(tt.current); setToast({ msg, err }); tt.current = setTimeout(() => setToast(null), 3200); };
  const sair = () => { store.set(LS_TOKEN, null); store.set(LS_PASSE, null); setToken(null); setPasse(null); setLojas(null); setMesa(null); };

  // modo local: a loja é a do agente; renova o passe quando tem internet
  useEffect(() => {
    if (!LOCAL) return;
    fetch(AGENTE + "/local/info").then((r) => r.json()).then((j) => {
      const d = j.data || {};
      setInfo(d); setLojas([{ cnpj: d.loja, nome: d.nome, online: true }]); setLoja(d.loja);
      if (token && d.loja) pegarPasse(token, d.loja, true).then(setPasse).catch(() => {});
    }).catch(() => setInfo({ erro: true }));
  }, []);

  useEffect(() => {
    if (!token || LOCAL) return;
    api("/empresas", { token }).then(({ data }) => {
      const l = data || [];
      setLojas(l);
      if (!loja || !l.some((x) => x.cnpj === loja)) { const p = l[0]; if (p) { setLoja(p.cnpj); store.set(LS_LOJA, p.cnpj); } }
    }).catch((e) => { if (e.status === 401) sair(); else avisar(e.message, true); });
  }, [token]);

  if (LOCAL && !info) return <div className="login-wrap"><div className="carreg">Conectando ao agente da loja…</div></div>;
  if (LOCAL && (info.erro || !info.pronto)) return (
    <div className="login-wrap"><div className="lcard" style={{ maxWidth: 420 }}>
      <span className="sora" style={{ fontWeight: 700, fontSize: 18 }}>Modo local ainda não configurado</span>
      <span style={{ fontSize: 14, color: "#7f9cc9" }}>O agente desta loja precisa conectar na internet uma vez pra receber a configuração. Confira a internet do computador do agente e recarregue a página.</span>
    </div></div>
  );
  if (!token || (LOCAL && !passe)) return <Login onOk={async (t, manter) => {
    if (LOCAL) { const p = await pegarPasse(t, info.loja, manter); setPasse(p); }
    store.set(LS_TOKEN, t, manter); setToken(t);
  }} />;
  const lojaAtual = (lojas || []).find((l) => l.cnpj === loja);
  const ctx = { token, loja, avisar };
  return (
    <div className="fundo-app">
      <header className="hdr">
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div className="logo">&lt;v/&gt;</div>
          <div className="marca"><b>Meu Giro</b><small>MESAS</small></div>
        </div>
        {mesa && (<><div className="sep" /><button className="hbtn" onClick={() => setMesa(null)}>← Mesas</button></>)}
        <div style={{ flex: 1 }} />
        {LOCAL && <span className="pill" style={{ background: "rgba(59,155,232,.12)", color: "#5aaef0" }}><i style={{ background: "#3b9be8" }} />Rede local</span>}
        {lojas && lojas.length > 0 && (
          <div className="loja">
            <span className="av">{iniciais(lojaAtual ? lojaAtual.nome : "")}</span>
            <select disabled={LOCAL} value={loja || ""} onChange={(e) => { setLoja(e.target.value); store.set(LS_LOJA, e.target.value); setMesa(null); }}>
              {lojas.map((l) => <option key={l.cnpj} value={l.cnpj}>{(l.nome || l.cnpj) + (l.online ? "" : " (offline)")}</option>)}
            </select>
          </div>
        )}
        <button className="hbtn ghost" onClick={sair}>Sair</button>
      </header>
      {!loja ? <div className="carreg">Carregando lojas…</div>
        : mesa ? <Mesa key={mesa.idMesa} {...ctx} mesa={mesa} voltar={() => setMesa(null)} />
        : <Salao {...ctx} abrir={setMesa} />}
      {toast && (
        <div className="toast" style={{ border: "1px solid " + (toast.err ? "#6b2a2a" : "#1f6b3e") }}>
          <span className="ic" style={{ background: toast.err ? "#f05252" : "#22c55e" }}>{toast.err ? "!" : "✓"}</span>{toast.msg}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ login */
function Login({ onOk }) {
  const [user, setUser] = useState(""), [pass, setPass] = useState("");
  const [show, setShow] = useState(false), [manter, setManter] = useState(true);
  const [erro, setErro] = useState(""), [busy, setBusy] = useState(false);
  async function entrar(e) {
    e.preventDefault();
    if (!user.trim() || !pass) { setErro("Preencha usuário e senha."); return; }
    setBusy(true); setErro("");
    try {
      const { data } = await api("/auth/login", { method: "POST", body: { email: user.trim(), senha: pass, deviceId: deviceId(), deviceNome: "Navegador (Mesas)" } });
      await onOk(data.token, manter);
    } catch (er) {
      setErro(er instanceof TypeError ? "Sem internet: neste computador é preciso entrar uma vez com internet. Depois funciona sem." : er.message);
    }
    setBusy(false);
  }
  const borda = "1px solid " + (erro ? "#6b2a2a" : "#1f2b48");
  return (
    <div className="login-wrap">
      <form className="login" onSubmit={entrar}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, textAlign: "center" }}>
          <div className="logo" style={{ width: 56, height: 56, borderRadius: 16, fontSize: 16 }}>&lt;v/&gt;</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 26, letterSpacing: "-.02em", color: "#f2f6fc" }}>Meu Giro</span>
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".16em", color: "#f5a524" }}>MESAS</span>
          </div>
        </div>
        <div className="lcard">
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 18, color: "#f2f6fc" }}>Entrar</span>
            <span style={{ fontSize: 13, color: "#7f9cc9" }}>Use o mesmo usuário e senha do app Meu Giro.</span>
          </div>
          <label className="campo"><span>Usuário</span>
            <input value={user} onChange={(e) => { setUser(e.target.value); setErro(""); }} placeholder="usuário ou e-mail" autoComplete="username" style={{ border: borda }} autoFocus />
          </label>
          <label className="campo"><span>Senha</span>
            <div style={{ position: "relative" }}>
              <input type={show ? "text" : "password"} value={pass} onChange={(e) => { setPass(e.target.value); setErro(""); }} placeholder="••••••" autoComplete="current-password" style={{ border: borda, paddingRight: 72 }} />
              <button type="button" onClick={() => setShow(!show)} style={{ position: "absolute", right: 6, top: 6, height: 34, padding: "0 10px", border: 0, borderRadius: 9, background: "transparent", color: "#5aaef0", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>{show ? "Ocultar" : "Mostrar"}</button>
            </div>
          </label>
          {erro && <span style={{ fontSize: 13, fontWeight: 600, color: "#f05252" }}>{erro}</span>}
          <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", fontSize: 13, color: "#c9d6ea" }} onClick={(e) => { e.preventDefault(); setManter(!manter); }}>
            <span style={{ width: 20, height: 20, flex: "none", borderRadius: 6, border: "1px solid " + (manter ? "#22c55e" : "#2a3a5c"), background: manter ? "#22c55e" : "#0c1426", color: "#04210f", fontSize: 12, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" }}>{manter ? "✓" : ""}</span>
            Manter conectado neste dispositivo
          </label>
          <button type="submit" className="bt verde" disabled={busy} style={{ height: 48 }}>{busy ? "Entrando…" : "Entrar"}</button>
        </div>
        <span style={{ textAlign: "center", fontSize: 13, color: "#7189b0" }}>Esqueceu a senha? Fale com o gerente da loja.</span>
      </form>
    </div>
  );
}

/* ------------------------------------------------------------------ salão (grade de mesas) */
function Salao({ token, loja, avisar, abrir }) {
  const [mesas, setMesas] = useState(null), [erro, setErro] = useState(""), [filtro, setFiltro] = useState("Todas");
  const carregar = useCallback(async () => {
    try { const { data } = await api("/salao/garcom/mesas", { token, loja }); setMesas(data.mesas || []); setErro(""); }
    catch (e) { setErro(e.status === 404 ? "Esta loja não tem o restaurante (agente Link) ou o agente precisa ser atualizado." : e.message); }
  }, [token, loja]);
  useEffect(() => { setMesas(null); carregar(); const t = setInterval(carregar, 15000); return () => clearInterval(t); }, [carregar]);

  if (erro && !mesas) return <div className="carreg" style={{ color: "#f05252" }}>{erro}</div>;
  if (!mesas) return <div className="carreg">Carregando mesas…</div>;
  const ocupadas = mesas.filter((m) => m.idAtendimento);
  const aberto = ocupadas.reduce((s, m) => s + nnum(m.total), 0);
  const filtros = [["Todas", mesas.length, "#3b9be8"], ["Livres", mesas.length - ocupadas.length, "#22c55e"], ["Ocupadas", ocupadas.length, "#f5a524"]];
  const vis = mesas.filter((m) => filtro === "Todas" || (filtro === "Livres" ? !m.idAtendimento : !!m.idAtendimento));
  return (
    <main className="main-mesas">
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <h1 className="h1">Salão</h1>
          <span className="resumo">{ocupadas.length} de {mesas.length} mesas ocupadas · {brl(aberto)} em aberto</span>
        </div>
        <div className="filtros">
          {filtros.map(([l, c, dot]) => (
            <button key={l} onClick={() => setFiltro(l)} style={{ background: filtro === l ? "#1a2846" : "transparent", color: filtro === l ? "#fff" : "#a9badb" }}>
              <span className="dot" style={{ background: dot }} />{l}<span className="cnt">{c}</span>
            </button>
          ))}
        </div>
      </div>
      {!mesas.length ? <div className="vazio" style={{ margin: 0 }}>Nenhuma mesa ativa. Ative as mesas no LinkPro.</div> : (
        <div className="grade">
          {vis.map((m) => {
            const oc = !!m.idAtendimento, ac = oc ? "#f5a524" : "#22c55e";
            const itens = nnum(m.itens);
            return (
              <button key={m.idMesa} className="card" onClick={() => abrir(m)}
                style={{ border: "1px solid " + (oc ? "#3a3220" : "#173a2b"), background: oc ? "linear-gradient(180deg,#16203a,#111a30)" : "#0f1830" }}>
                <div className="barra" style={{ background: ac }} />
                <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
                  <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                    <span className="rot">MESA</span>
                    <span className="num">{pad(m.numero)}</span>
                  </div>
                  <span className="pill" style={{ background: oc ? "rgba(245,165,36,.12)" : "rgba(34,197,94,.12)", color: ac }}><i style={{ background: ac }} />{oc ? "Ocupada" : "Livre"}</span>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 3, minWidth: 0 }}>
                  <span className="sora" style={{ fontWeight: 600, fontSize: 17, color: oc ? "#f2f6fc" : "#7f9cc9" }}>{oc ? brl(nnum(m.total)) : "Disponível"}</span>
                  <span style={{ fontSize: 12, color: "#7189b0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {oc ? [m.cliente, itens ? qtdTxt(itens) + (itens > 1 ? " itens" : " item") : "", m.abertura ? "há " + ago(m.abertura) : ""].filter(Boolean).join(" · ") : "Toque para abrir"}
                  </span>
                </div>
              </button>
            );
          })}
        </div>
      )}
    </main>
  );
}

/* ------------------------------------------------------------------ mesa */
function Mesa({ token, loja, avisar, mesa, voltar }) {
  const [idAt, setIdAt] = useState(mesa.idAtendimento || null);
  const [com, setCom] = useState(null);
  const [cli, setCli] = useState({ id: null, nome: "", tabela: "" });
  const [cliAberto, setCliAberto] = useState(false);
  // carrinho fica salvo no aparelho até o servidor confirmar: caiu a conexão, fechou a tela, nada se perde
  const chaveCart = "mg_mesas_cart_" + loja + "_" + mesa.idMesa;
  const salvo = (() => { try { return JSON.parse(store.get(chaveCart) || "null"); } catch (e) { return null; } })();
  const [cart, setCart] = useState((salvo && salvo.itens) || []);
  const pendente = useRef((salvo && salvo.codigo) || null); // código do pedido ainda não confirmado
  const [busy, setBusy] = useState(false);
  const [falha, setFalha] = useState(false);
  const [pagar, setPagar] = useState(false);
  useEffect(() => {
    store.set(chaveCart, cart.length ? JSON.stringify({ itens: cart, codigo: pendente.current }) : null);
  }, [cart]);

  const carregar = useCallback(async (id = idAt) => {
    if (!id) return;
    try {
      const { data } = await api("/salao/garcom/atendimento/" + id, { token, loja });
      setCom(data); setCli((x) => ({ ...x, id: data.idCliente ?? null, nome: data.cliente || "" }));
    } catch (e) { avisar(e.message, true); }
  }, [idAt, token, loja]);
  useEffect(() => { carregar(); }, []);

  const itens = ((com && com.itens) || []).filter((i) => !i.cancelado);
  const total = itens.reduce((s, i) => s + nnum(i.qtd) * nnum(i.preco), 0);
  const qtdItens = itens.reduce((s, i) => s + nnum(i.qtd), 0);
  // agrupa por envio (codigo_pedido), na ordem em que chegaram
  const pedidos = [];
  itens.forEach((i) => {
    let p = pedidos.find((x) => x.k === (i.pedido || i.id));
    if (!p) { p = { k: i.pedido || i.id, hora: i.hora, linhas: [] }; pedidos.push(p); }
    p.linhas.push(i);
  });
  const aberta = !com || com.aberto !== false;
  const cartTotal = cart.reduce((s, c) => s + c.qtd * c.preco, 0);
  const cartQtd = cart.reduce((s, c) => s + c.qtd, 0);
  const ocupada = !!idAt && itens.length > 0;
  const ac = ocupada ? "#f5a524" : "#22c55e";

  async function precosDoCarrinho(idCli) {
    if (!cart.length) return;
    try {
      const ids = [...new Set(cart.map((c) => c.id))].join(",");
      const { data } = await api("/salao/garcom/produtos?ids=" + ids + (idCli ? "&idCliente=" + idCli : ""), { token, loja });
      const m = Object.fromEntries((data || []).map((p) => [p.id, p]));
      setCart((cs) => cs.map((c) => (m[c.id] ? { ...c, preco: nnum(m[c.id].preco), normal: nnum(m[c.id].precoNormal) } : c)));
    } catch (e) {}
  }
  async function escolherCliente(c) {
    setCliAberto(false);
    const id = c ? c.id : null;
    if (id === cli.id) return;
    try {
      if (idAt) await api("/salao/garcom/atendimento/" + idAt + "/cliente", { method: "POST", token, loja, body: { idCliente: id } });
      setCli({ id, nome: c ? c.nome : "", tabela: c ? c.tabela : "" });
      await precosDoCarrinho(id); await carregar();
    } catch (e) { avisar(e.message, true); }
  }
  function add(p) {
    setCart((cs) => {
      const i = cs.findIndex((c) => c.id === p.id && !c.obs);
      if (i >= 0) { const n = [...cs]; n[i] = { ...n[i], qtd: n[i].qtd + 1 }; return n; }
      return [...cs, { id: p.id, nome: p.descricao, preco: nnum(p.preco), normal: nnum(p.precoNormal), qtd: 1, obs: "" }];
    });
  }
  async function enviar() {
    if (!cart.length || busy) return;
    // mesmo código no reenvio: se o primeiro chegou e só a resposta se perdeu, o agente não lança de novo
    if (!pendente.current) pendente.current = uuid();
    store.set(chaveCart, JSON.stringify({ itens: cart, codigo: pendente.current }));
    setBusy(true); setFalha(false);
    try {
      const { data } = await api("/salao/garcom/pedido", { method: "POST", token, loja, timeout: 10000, body: {
        idAtendimento: idAt || undefined, idMesa: idAt ? undefined : mesa.idMesa, idCliente: cli.id || undefined,
        codigoPedido: pendente.current,
        itens: cart.map((c) => ({ idProduto: c.id, qtd: c.qtd, ...(c.obs.trim() ? { obs: c.obs.trim() } : {}) })) } });
      pendente.current = null;
      setIdAt(data.idAtendimento); setCart([]);
      avisar((data.repetido ? "Pedido já tinha chegado · Mesa " : "Pedido enviado · Mesa ") + pad(mesa.numero));
      await carregar(data.idAtendimento);
    } catch (e) {
      if (e.rede) setFalha(true);
      else { pendente.current = null; avisar(e.message, true); }
    }
    setBusy(false);
  }

  return (
    <main className="main-mesa">
      <section className="col">
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <h1 className="h1">Mesa {pad(mesa.numero)}</h1>
          <span className="pill" style={{ height: 26, fontSize: 12, padding: "0 10px", background: ocupada ? "rgba(245,165,36,.12)" : "rgba(34,197,94,.12)", color: ac }}><i style={{ background: ac }} />{aberta ? (ocupada ? "Ocupada" : "Livre") : "Fechada"}</span>
          {com && com.abertura && <span style={{ fontSize: 13, color: "#7189b0" }}>{qtdItens ? qtdTxt(qtdItens) + (qtdItens > 1 ? " itens · " : " item · ") : ""}há {ago(com.abertura)}</span>}
        </div>

        <ClienteBox cli={cli} aberto={cliAberto} podeMexer={aberta} token={token} loja={loja}
          toggle={() => setCliAberto(!cliAberto)} escolher={escolherCliente} />

        <div className="box">
          <div className="boxh">
            <div style={{ display: "flex", alignItems: "center" }}><span className="t">Na mesa</span><span className="s">{qtdItens ? qtdTxt(qtdItens) + (qtdItens > 1 ? " itens" : " item") : ""}</span></div>
            <span className="v">{brl(total)}</span>
          </div>
          {!itens.length ? <div className="vazio">Nada lançado ainda.</div> : pedidos.map((p, i) => (
            <div className="ped" key={p.k}>
              <div className="pedh"><span>PEDIDO {i + 1}</span><span className="ln" /><span style={{ fontWeight: 600, letterSpacing: 0 }}>{hhmm(p.hora)}</span></div>
              {p.linhas.map((l) => (
                <div className="lin" key={l.id}>
                  <span className="q">{qtdTxt(l.qtd)}×</span>
                  <div style={{ display: "flex", flexDirection: "column", gap: 2, minWidth: 0 }}>
                    <span className="nm">{l.descricao}</span>
                    {l.obs && <span className="obs">{l.obs}</span>}
                  </div>
                  <Val preco={l.preco} normal={l.precoNormal} qtd={nnum(l.qtd)} />
                </div>
              ))}
            </div>
          ))}
          {aberta && itens.length > 0 && (
            <div className="rodape"><button className="bt laranja" onClick={() => setPagar(true)} disabled={cart.length > 0} title={cart.length ? "Envie ou limpe o pedido novo antes" : ""}>Receber e fechar</button></div>
          )}
          {!aberta && <div className="rodape" style={{ justifyContent: "flex-start", color: "#22c55e", fontWeight: 600 }}>Mesa fechada no caixa.</div>}
        </div>

        {aberta && (
          <div className="box" style={{ borderColor: cart.length ? "#1f5a3a" : "#1c2846" }}>
            <div className="boxh">
              <div style={{ display: "flex", alignItems: "center" }}><span className="t">Pedido novo</span><span className="s">{cartQtd ? cartQtd + (cartQtd > 1 ? " itens" : " item") : ""}</span></div>
              <span className="v">{brl(cartTotal)}</span>
            </div>
            {!cart.length ? <div className="vazio">Escolha os produtos ao lado.</div> : cart.map((c, idx) => (
              <div className="cartl" key={idx}>
                <div className="stepper">
                  <button onClick={() => setCart((cs) => cs.flatMap((x, j) => (j !== idx ? [x] : x.qtd > 1 ? [{ ...x, qtd: x.qtd - 1 }] : [])))}>−</button>
                  <span>{c.qtd}</span>
                  <button onClick={() => setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, qtd: x.qtd + 1 } : x)))}>+</button>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, minWidth: 0 }}>
                  <span className="nm" style={{ paddingTop: 8 }}>{c.nome}</span>
                  <input className="inp" value={c.obs} placeholder="observação (ex.: sem gelo)" maxLength={200}
                    onChange={(e) => { const v = e.target.value; setCart((cs) => cs.map((x, j) => (j === idx ? { ...x, obs: v } : x))); }} />
                </div>
                <Val preco={c.preco} normal={c.normal} qtd={c.qtd} cls="val" />
              </div>
            ))}
            {cart.length > 0 && (
              <div className="rodape" style={{ justifyContent: "space-between" }}>
                <button className="bt cont" onClick={() => { pendente.current = null; setCart([]); }}>Limpar</button>
                <button className="bt verde" onClick={enviar} disabled={busy}>{busy ? "Enviando…" : "Enviar pedido · " + brl(cartTotal)}</button>
              </div>
            )}
          </div>
        )}
      </section>

      {aberta ? <Produtos token={token} loja={loja} idCliente={cli.id} cart={cart} onAdd={add} /> : <div />}

      {falha && (
        <div className="fundo">
          <div className="modal" style={{ maxWidth: 420 }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: 12, padding: "28px 24px 22px" }}>
              <div style={{ width: 56, height: 56, borderRadius: 28, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(240,82,82,.12)", border: "1px solid rgba(240,82,82,.35)" }}>
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f05252" strokeWidth="2" strokeLinecap="round"><path d="M2 8.8a15 15 0 0 1 20 0" /><path d="M5 12.5a10 10 0 0 1 14 0" /><path d="M8.5 16a5 5 0 0 1 7 0" /><path d="M12 20h.01" /><path d="M3 3l18 18" /></svg>
              </div>
              <span className="sora" style={{ fontWeight: 700, fontSize: 19, color: "#f2f6fc" }}>A conexão com o servidor falhou</span>
              <span style={{ fontSize: 14, lineHeight: 1.5, color: "#a9badb" }}>
                O pedido da Mesa {pad(mesa.numero)} não foi confirmado. Os {cart.length} {cart.length === 1 ? "item continua salvo" : "itens continuam salvos"} aqui,
                nada se perde. Confira a rede e tente de novo.
              </span>
            </div>
            <div className="rodape" style={{ justifyContent: "space-between", padding: "0 22px 22px" }}>
              <button className="bt cont" onClick={() => setFalha(false)} disabled={busy}>Agora não</button>
              <button className="bt verde" onClick={enviar} disabled={busy}>{busy ? "Reconectando…" : "Tentar reconectar"}</button>
            </div>
          </div>
        </div>
      )}

      {pagar && idAt && (
        <Receber token={token} loja={loja} idAt={idAt} mesa={mesa} total={total} fechar={() => setPagar(false)}
          fim={async (r, msg) => {
            setPagar(false);
            if (r.finalizado) { avisar("Mesa " + pad(mesa.numero) + " fechada · " + brl(total) + (nnum(r.troco) > 0 ? " · troco " + brl(nnum(r.troco)) : "")); voltar(); }
            else { avisar(msg || "Pagamento registrado.", !!r.motivo); await carregar(); }
          }} />
      )}
    </main>
  );
}

function ClienteBox({ cli, aberto, podeMexer, token, loja, toggle, escolher }) {
  const [q, setQ] = useState(""), [lista, setLista] = useState(null);
  const deb = useRef(null);
  useEffect(() => {
    clearTimeout(deb.current);
    if (!aberto || q.trim().length < 2) { setLista(null); return; }
    deb.current = setTimeout(async () => {
      try { setLista((await api("/salao/garcom/clientes?q=" + encodeURIComponent(q.trim()), { token, loja })).data || []); } catch (e) { setLista([]); }
    }, 300);
  }, [q, aberto]);
  const tem = !!cli.id;
  return (
    <div className="box">
      <button className="cli" onClick={() => podeMexer && toggle()} style={{ cursor: podeMexer ? "pointer" : "default" }}>
        <div className="av" style={{ background: tem ? "#2a1f4a" : "#16223d", color: tem ? "#b79bff" : "#7189b0" }}>{tem ? iniciais(cli.nome) : "?"}</div>
        <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: 2 }}>
          <span style={{ fontWeight: 700, fontSize: 15, color: "#f2f6fc" }}>{tem ? cli.nome : "Sem cliente"}</span>
          <span style={{ fontSize: 13, color: "#7f9cc9" }}>{tem ? (cli.tabela ? "Aplicando tabela " + cli.tabela : "Preços pela tabela do cliente") : "Clique pra escolher o cliente (aplica a tabela de preço dele)"}</span>
        </div>
        {podeMexer && <span style={{ fontSize: 12, fontWeight: 700, color: "#5aaef0" }}>{aberto ? "Fechar" : tem ? "Trocar" : "Escolher"}</span>}
      </button>
      {aberto && (
        <div style={{ display: "flex", flexDirection: "column", gap: 2, padding: 6, borderTop: "1px solid #1c2846" }}>
          <div style={{ padding: "4px 6px 6px" }}>
            <input className="inp" style={{ height: 38 }} autoFocus placeholder="Buscar cliente: nome, apelido ou CPF/CNPJ" value={q} onChange={(e) => setQ(e.target.value)} />
          </div>
          {lista && !lista.length && <div style={{ padding: "8px 12px", fontSize: 13, color: "#7f9cc9" }}>Nenhum cliente encontrado.</div>}
          {(lista || []).map((c) => (
            <button key={c.id} className="cliop" onClick={() => escolher(c)}>
              <span>{c.nome}{c.documento ? <span style={{ color: "#6f86ab", fontWeight: 500 }}> · {c.documento}</span> : null}</span>
              <span style={{ fontSize: 12, fontWeight: 500, color: "#7189b0" }}>{c.tabela ? "Tabela " + c.tabela : "sem tabela"}</span>
            </button>
          ))}
          {tem && <button className="cliop" onClick={() => escolher(null)}><span>Remover cliente</span><span style={{ fontSize: 12, fontWeight: 500, color: "#7189b0" }}>volta ao preço normal</span></button>}
        </div>
      )}
    </div>
  );
}

function Produtos({ token, loja, idCliente, cart, onAdd }) {
  const [q, setQ] = useState(""), [grupos, setGrupos] = useState([]), [grupo, setGrupo] = useState(null);
  const [lista, setLista] = useState(null);
  const deb = useRef(null);
  useEffect(() => { api("/salao/garcom/grupos", { token, loja }).then(({ data }) => setGrupos(data || [])).catch(() => {}); }, [token, loja]);
  useEffect(() => {
    clearTimeout(deb.current);
    const t = q.trim();
    if (t.length === 1 && !/^\d$/.test(t)) return;
    deb.current = setTimeout(async () => {
      try {
        const { data } = await api("/salao/garcom/produtos?q=" + encodeURIComponent(t) + (idCliente ? "&idCliente=" + idCliente : "") + (grupo ? "&grupo=" + grupo : ""), { token, loja });
        setLista(data || []);
      } catch (e) { setLista([]); }
    }, t ? 300 : 0);
  }, [q, grupo, idCliente, token, loja]);
  const chip = (id, label) => {
    const sel = grupo === id;
    return <button key={label} className="chip" onClick={() => setGrupo(id)} style={{ border: "1px solid " + (sel ? "#3b9be8" : "#1f2b48"), background: sel ? "#3b9be8" : "#141f38", color: sel ? "#fff" : "#c9d6ea" }}>{label}</button>;
  };
  return (
    <section className="prodbox">
      <div style={{ display: "flex", flexDirection: "column", gap: 12, padding: "16px 16px 12px", borderBottom: "1px solid #172340" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontWeight: 700, fontSize: 15, color: "#f2f6fc" }}>Produtos</span>
          <span style={{ fontSize: 12, color: "#7189b0" }}>{lista ? lista.length + " produtos" : ""}</span>
        </div>
        <div className="busca"><span>⌕</span><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Nome, código ou código de barras" /></div>
        {grupos.length > 0 && <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>{chip(null, "Todos")}{grupos.map((g) => chip(g.id, g.nome))}</div>}
      </div>
      <div style={{ flex: 1, minHeight: 0, overflow: "auto", padding: "6px 8px 10px" }}>
        {lista == null ? <div className="carreg">Carregando…</div> : !lista.length ? <div className="carreg">Nenhum produto encontrado.</div> : lista.map((p) => {
          const noCart = cart.filter((c) => c.id === p.id).reduce((s, c) => s + c.qtd, 0);
          return (
            <button key={p.id} className="prod" onClick={() => onAdd(p)}>
              <div style={{ display: "flex", flexDirection: "column", gap: 3, minWidth: 0 }}>
                <span style={{ fontSize: 14, fontWeight: 600, color: "#e6edf7" }}>{p.descricao}</span>
                <span style={{ fontSize: 12, color: "#6f86ab" }}>{[p.codigo, p.grupo].filter(Boolean).join(" · ")}</span>
              </div>
              <Val preco={p.preco} normal={p.precoNormal} cls="val" />
              <span className="add" style={{ background: noCart ? "#22c55e" : "#16223d", color: noCart ? "#04210f" : "#8cc6f5" }}>{noCart || "+"}</span>
            </button>
          );
        })}
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ receber */
const METODOS = [["dinheiro", "Dinheiro"], ["pix", "Pix"], ["debito", "Débito"], ["credito", "Crédito"]];
function Receber({ token, loja, idAt, mesa, total, fechar, fim }) {
  const [metodo, setMetodo] = useState("dinheiro");
  const [entrada, setEntrada] = useState("");
  const [pags, setPags] = useState([]);
  const [busy, setBusy] = useState(false), [erro, setErro] = useState("");
  const pago = pags.reduce((s, p) => s + p.valor, 0);
  const dinheiro = pags.filter((p) => p.forma === "dinheiro").reduce((s, p) => s + p.valor, 0);
  const resto = Math.round((total - pago) * 100) / 100;
  const troco = Math.max(0, -resto);
  const trocoInvalido = troco > dinheiro + 0.004;
  const pode = pags.length > 0 && resto <= 0.005 && !trocoInvalido;
  const nomeMetodo = (k) => (METODOS.find((m) => m[0] === k) || [k, k])[1];

  function adicionar(v) {
    const valor = v != null ? v : (entrada ? num(entrada) : Math.max(resto, 0));
    if (!(valor > 0)) return;
    setPags((ps) => [...ps, { forma: metodo, valor: Math.round(valor * 100) / 100 }]);
    setEntrada(""); setErro("");
  }
  async function confirmar() {
    if (!pode || busy) return;
    setBusy(true); setErro("");
    try {
      const { data, message } = await api("/salao/garcom/atendimento/" + idAt + "/receber", { method: "POST", token, loja,
        body: { pagamentos: pags.map((p) => ({ forma: p.forma, valor: p.valor })), finalizar: true } });
      fim(data || {}, message);
    } catch (e) { setErro(e.message); }
    setBusy(false);
  }
  const corResto = resto > 0.005 ? "#f05252" : resto < -0.005 ? (trocoInvalido ? "#f05252" : "#f5a524") : "#22c55e";
  const rotResto = resto > 0.005 ? "Falta" : resto < -0.005 ? (trocoInvalido ? "Troco maior que o dinheiro" : "Troco") : "Quitado";
  return (
    <div className="fundo" onClick={() => !busy && fechar()}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", flexDirection: "column", gap: 4, padding: "20px 22px 18px", borderBottom: "1px solid #172340" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span className="sora" style={{ fontWeight: 700, fontSize: 20, color: "#f2f6fc" }}>Receber · Mesa {pad(mesa.numero)}</span>
            <button className="x" onClick={fechar} disabled={busy}>×</button>
          </div>
          <span style={{ fontSize: 13, color: "#7f9cc9" }}>Total da mesa</span>
          <span className="sora" style={{ fontWeight: 700, fontSize: 36, letterSpacing: "-.02em", color: "#f2f6fc" }}>{brl(total)}</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14, padding: "18px 22px" }}>
          <div className="metodos">
            {METODOS.map(([k, l]) => <button key={k} onClick={() => setMetodo(k)} style={{ background: metodo === k ? "#3b9be8" : "transparent", color: metodo === k ? "#fff" : "#a9badb" }}>{l}</button>)}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1, position: "relative" }}>
              <span className="sora" style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontWeight: 600, fontSize: 14, color: "#6f86ab" }}>R$</span>
              <input value={entrada} onChange={(e) => setEntrada(e.target.value)} onKeyDown={(e) => e.key === "Enter" && adicionar()} inputMode="decimal"
                placeholder={metodo === "dinheiro" ? "valor entregue" : "valor em " + nomeMetodo(metodo).toLowerCase()}
                style={{ width: "100%", height: 48, padding: "0 14px 0 44px", borderRadius: 12, border: "1px solid #2a4a7a", background: "#0c1426", color: "#f2f6fc", font: "600 16px Sora", outline: "none" }} />
            </div>
            <button onClick={() => adicionar()} style={{ height: 48, padding: "0 18px", borderRadius: 12, border: "1px solid #2a4a7a", background: "#13233f", color: "#8cc6f5", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Adicionar</button>
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {[["Valor restante", Math.max(resto, 0)], ["R$ 20", 20], ["R$ 50", 50], ["R$ 100", 100]].map(([l, v]) => (
              <button key={l} className="rapido" onClick={() => adicionar(v)}>{l}</button>
            ))}
          </div>
          {pags.map((p, i) => (
            <div className="pl" key={i}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#22c55e" }} />
              <span style={{ flex: 1, fontSize: 14, fontWeight: 600, color: "#dbe5f3" }}>{nomeMetodo(p.forma)}</span>
              <span className="sora" style={{ fontWeight: 600, fontSize: 14 }}>{brl(p.valor)}</span>
              <button onClick={() => setPags((ps) => ps.filter((_, j) => j !== i))} style={{ width: 26, height: 26, border: 0, borderRadius: 7, background: "transparent", color: "#7189b0", cursor: "pointer", fontSize: 14 }}>×</button>
            </div>
          ))}
          {erro && <span style={{ fontSize: 13, fontWeight: 600, color: "#f05252" }}>{erro}</span>}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, padding: "14px 22px", borderTop: "1px solid #172340", background: "#0d1629" }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, color: "#a9badb" }}><span>Recebido</span><span className="sora" style={{ fontWeight: 600, color: "#e6edf7" }}>{brl(pago)}</span></div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: corResto }}>{rotResto}</span>
            <span className="sora" style={{ fontWeight: 700, fontSize: 22, color: corResto }}>{brl(Math.abs(resto))}</span>
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, padding: "16px 22px 20px" }}>
          <button className="bt cont" onClick={fechar} disabled={busy} style={{ height: 48, fontSize: 15, fontWeight: 700, color: "#c9d6ea" }}>Cancelar</button>
          <button className="bt" onClick={confirmar} disabled={!pode || busy}
            style={{ height: 48, padding: "0 24px", background: pode ? "#22c55e" : "#173a2b", color: pode ? "#04210f" : "#4f7d63", opacity: 1 }}>
            {busy ? "Fechando…" : "Receber e fechar"}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
