server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # .jsx do painel/site (o Babel do navegador compila)
    location ~* \.jsx$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(png|svg|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
    }
    # /painel também abre o painel.html (igual à Vercel)
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
